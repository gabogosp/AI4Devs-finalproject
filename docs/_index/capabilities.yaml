# Materialized index of PRD §2.1 capabilities → US coverage.
# Source of truth: docs/product/prd.md §2.1.
- id: CAP-1
  title: Catálogo y navegación por categorías
  priority: Must
  us-coverage: [US-001-admin-catalogo-productos, US-002-storefront-navegacion-categorias, US-003-ficha-producto-pdp]
- id: CAP-2
  title: Búsqueda semántica con IA
  priority: Must
  us-coverage: [US-004-busqueda-semantica]
- id: CAP-3
  title: Enriquecimiento de descripciones con IA
  priority: Must
  us-coverage: [US-005-enriquecimiento-ia-embeddings]
- id: CAP-4
  title: Ficha, carrito y checkout guest con MercadoPago (+ pago simulado DSM)
  priority: Must
  us-coverage: [US-007-carrito-compra, US-008-checkout-guest, US-009-pago-mercadopago]
- id: CAP-5
  title: Fulfillment — retiro en sucursal + panel de órdenes del dueño
  priority: Must
  us-coverage: [US-012-panel-ordenes-dueno]
- id: CAP-6
  title: Registro de orden, ajuste de stock y notificaciones
  priority: Must
  us-coverage: [US-010-orden-webhook-stock, US-011-notificaciones-email]
- id: CAP-7
  title: Importación masiva de inventario (CSV/Excel)
  priority: Should
  us-coverage: [US-006-import-masivo-inventario]
- id: CAP-8
  title: Cuentas de cliente registradas
  priority: Should
  us-coverage: [US-014-registro-login, US-015-historial-compras]
- id: CAP-9
  title: Panel de métricas del dueño
  priority: Should
  us-coverage: [US-016-panel-metricas]
- id: CAP-10
  title: Páginas legales + consentimiento
  priority: Must
  # PARTIDA el 2026-08-23 por decisión del PO (AUDIT-FLOW-002 la había dejado como pregunta
  # abierta). CAP-10 se queda con lo que el PRD §2.1 cap. 10 describe literalmente: las DOS
  # páginas publicadas —privacidad y términos— más el registro del consentimiento al comprar.
  # Es contenido publicado + un flag en la orden: se entrega una vez y no vuelve a tocarse.
  us-coverage: [US-017-paginas-legales-consentimiento]
- id: CAP-13
  title: Cumplimiento de datos personales (Ley 25.326)
  priority: Must
  # Capacidad NUEVA, no una renumeración: sale de partir CAP-10. Va con id 13 y no 11 para no
  # correr las diez que ya existen, que romperían el `prd-capacity` del frontmatter de todas
  # las US y la trazabilidad del build-order.
  #
  # Por qué es otra capacidad y no la misma: publicar dos páginas es contenido; atender los
  # DERECHOS de las personas sobre sus datos es un proceso operativo con obligaciones propias
  # —plazos, irreversibilidad, auditoría— que se ejerce cada vez que alguien lo pide, y que
  # además cubre a compradores INVITADOS, que no tienen cuenta y por eso quedan fuera del
  # alcance de US-020. Agruparlas hacía que «capacidad 10 entregada» significara dos cosas
  # distintas según a quién se le preguntara.
  #
  # Es la única capacidad que NO viene del PRD §2.1: emergió del plan de backend de US-008 al
  # modelar la primera PII en reposo del proyecto (su OQ-BE-5). El PRD §6 sí fija los 12 meses
  # y la anonimización, así que el requisito existía; lo que faltaba era la capacidad que lo
  # nombrara. Vale como CR contra el PRD.
  us-coverage: [US-020-borrado-cuenta-datos-personales, US-021-retencion-datos-ordenes]
- id: CAP-11
  title: Cancelación / reembolso de orden
  priority: Should
  us-coverage: [US-013-cancelacion-reembolso]
- id: CAP-12
  title: Canal de contacto / soporte (WhatsApp)
  priority: Should
  us-coverage: [US-018-contacto-whatsapp]
