  # BE SACADO 2026-08-23 — resolución de OQ-FE-18, opción (a): `BE-US-017` queda ABSORBIDA por
  # US-008. La US §7 le asignaba al backend «servir el contenido legal + versionado». Las dos
  # mitades desaparecieron por decisiones de diseño ya tomadas, no por recorte de alcance:
  #   · Servir el contenido: el design.md de US-017 D1 lo fija como módulo tipado en el FE y D5
  #     la versión en el código. No hay endpoint que servir. Un endpoint para dos documentos que
  #     cambian una vez por año le agregaría una dependencia de red a una página cuya razón de
  #     ser es estar disponible siempre — lo que el guard noBackendNoTracking.test.tsx prohíbe.
  #   · Versionado: se lo quedó US-008 (`LEGAL_TERMS_VERSION` + `orders.consent_terms_version` +
  #     su CHECK). La propia US lo asigna ahí en AC-4 y AC-8. El FE verifica el contrato contra
  #     esa declaración en versionContract.test.ts, en vez de construirlo.
  # Se saca del array en vez de dejarlo como task fantasma para que el flow-auditor no lea una
  # disciplina sin cobertura (opción (b) descartada, con su costo escrito en el proposal).
  disciplines: [FE, QA]
  parent-prd: docs/product/prd.md
  linear-issue-id: null
  created: 2026-06-15
  ready-at: 2026-06-15
  in-progress-at: 2026-08-22        # first plan invocation (frontend-web-developer)
  blocked_by: [US-001]
