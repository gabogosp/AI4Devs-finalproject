  # confirmación, el decremento de stock y la limpieza de órdenes abandonadas son de
  # US-010 (ADR-0008). La orden nace INERTE: no retiene stock, no mueve plata y es
  # invisible para el panel del dueño (pending_payment). `delivered_at` y `customer_id`
  # se crean por el DER y quedan SIN ESCRITOR (US-012 y US-015).
  #
  # DEVIACIONES DECLARADAS en design.md: 5 columnas sobre el DER del E2E §8 —
  # access_token_hash (el seam de US-009), consent_accepted_at + consent_terms_version
  # (AC-8 pide marca temporal y trazabilidad legal; el DER sólo tiene el booleano),
  # orders.updated_at, y order_items.product_name + product_sku (la orden es un registro
  # comercial: renombrar un producto no puede reescribir el email de US-011 ni el panel
  # de US-012) — más CHECK (consent_accepted = true), que hace estructuralmente imposible
  # una orden sin consentimiento, y la ausencia de Idempotency-Key (deviación de
  # api-standards §10.1: el recurso creado es inerte, el riesgo que §10 protege es el
  # doble cobro y acá no hay cobro; cualquier forma de reuso acoplaría este change con el
  # de pagos en ambos sentidos). Sin ADR nuevo: ADR-0008 gobierna el stock, ADR-0006 la
  # ausencia de datos de tarjeta.
  #
  # 5 preguntas abiertas, NINGUNA bloquea el arranque (todas con default implementado).
  # Las dos que conviene decidir ANTES de ejecutar:
  #   OQ-BE-4 — ¿número legible de pedido? Hoy no (YAGNI, ningún AC lo pide), pero
  #             US-011 (email) y US-012 (panel) casi seguro lo van a querer para que el
  #             dueño y el comprador hablen del mismo pedido por teléfono; agregarlo
  #             después es una migración con sequence.
  #   OQ-BE-5 — retención/borrado de la PII del comprador INVITADO. El PRD §6 fija 12
  #             meses + anonimización y NINGUNA US lo implementa (US-020 cubre sólo
  #             cuentas registradas). Es exposición legal (Ley 25.326), no deuda técnica
  #             cosmética: la recomendación es abrir una US de retención antes de
  #             producción.
  #
  # DEPLOYMENT: no requiere /plan-deployment propio (migración aditiva, sin secretos
  # nuevos, sin feature flag), pero SÍ conviene coordinarlo con el de US-009 — este
  # change cambia el perfil de riesgo del proyecto al introducir PII en reposo, y su
  # migración es la que habilita la de `payments`.
  # DECISIONES DEL PO (2026-08-22): OQ-BE-1 opción (a) — doble submit crea DOS órdenes
  # inertes, sin acoplar con US-009. OQ-BE-4 opción (a) — se agrega `orders.order_number`
  # (int UNIQUE, SEQUENCE START WITH 1000) AHORA: después sería un ALTER con backfill sobre
  # órdenes reales, y arrancar en 1000 evita que un «Pedido #3» le informe al comprador que
  # la tienda vendió dos veces (PRD §1.3 — confianza = conversión). Va en el 201 y en el
  # contrato; NO autoriza nada (eso es el order_token). Efecto: T0.1 pasa de 15 a 16
  # columnas y Fase 0 de 1,8 a 2,2 h. OQ-BE-5 opción (a) — se abre una US de retención de
  # PII antes de producción; ESA US TODAVÍA NO EXISTE (candidata US-021), este change sigue
  # sin implementar purga. OQ-BE-2 y OQ-BE-3 quedan con default.
