# Materialized index of OpenSpec changes.
# Source of truth: openspec/changes/*/proposal.md frontmatter.
# Owned per-entry by the planning agent that creates the change; status transitions
# are touched by /develop-*, /commit, /archive-change.
#
# Greenfield bootstrap split (railway-baseline §0): US-001 legitimately has TWO
# infrastructure changes, distinguished by `variant` (bootstrap-local | platform-cloud)
# per openspec-changes.schema.yaml (F39). The discipline stays the trailing folder token.
#
# Rama de integración (desviación consciente, per schema `branch` — F42): el framework
# modela 1 change = 1 rama = 1 PR. Este repo integra el trabajo de US-001 (backend +
# frontend-web) en `feature-entrega2-GOSP` por la cadencia de entregas del máster, así que
# NO existe una rama feat/ por change. El schema es explícito: no registrar una rama nominal
# que no existe — queda `branch: null` y la verdad la carga `pr-url` cuando se abra el PR.

# `assignee` — quien EJECUTA el change (convencion adoptada 2026-08-19, gap F60).
# Existe porque el canal de mensajes entre sesiones demostro ser incompleto: ni
# `ListAgents` ni los transcripts listan a todos los actores, y ninguna de las dos
# fuentes se anuncia como parcial. Con este campo, "quien tiene esta task" se
# responde leyendo el repo.
# Valor = id corto de la sesion, SOLO cuando ella lo confirmo de forma directa.
# `sin-identificar` cuando no hay confirmacion — distinto de `null`, que significa
# "nadie escribio el campo". Una correlacion plausible NO alcanza: va en comentario.
# `sin-asignar` cuando el change esta PLANIFICADO pero nadie lo ejecuta todavia
# (0 tasks cerradas). Es distinto de `sin-identificar`: ahi hay alguien trabajando
# y no sabemos quien; aca no hay nadie.
#
# OBLIGATORIO AL CREAR LA ENTRADA (ratificado por el PO 2026-08-23). La convencion
# ya se degrado una vez: se poblaron los 12 changes que existian el 2026-08-19 y
# los 6 creados despues nacieron con `null`, asi que cuando aparecio un defecto
# bloqueante no supimos a quien reportarlo. Un campo que se puebla una vez y no se
# mantiene miente mas rapido de lo que informa. Todo `/plan-*-ticket` debe escribir
# `assignee` en la entrada nueva: la sesion que planifica pone su id si ademas va a
# ejecutar, y `sin-asignar` si no. Nunca `null`.
#
# La verificacion automatica de esto vive en el comando del framework
# (`spekode/`, submodulo del repo privado ai-specs), que es COMPARTIDO por todos
# los proyectos cliente: cambiarlo es un commit en ese otro repo y afecta a todos.
# Queda planteado al PO, no aplicado unilateralmente desde aca.

