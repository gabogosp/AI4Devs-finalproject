  # diferido GET /v1/admin/imports a US-016 · OQ-FE-5 (a) tabla de rechazos en pantalla Y descarga
  # del CSV.
  #
  # 4,6 h AI-asistido / ~9 h tradicional (13 tasks + 4 pre-requisitos). La US §7 presupuesta
  # FE-US-006 en 8-12 h tradicional: entra en el rango porque el contrato ya está publicado, las
  # tres operaciones YA existen en el cliente generado (verificado al planificar) y se reusan
  # patrones establecidos — productsService, AsyncState, TanStack Table y, sobre todo,
  # revalidateCatalogSafely(), que ya existe y es la mitad de la costura que el backend declaró y
