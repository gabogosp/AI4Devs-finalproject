  # COLISION DE SESIONES (2026-08-20): una sesion paralela ya habia commiteado un plan
  # para este mismo change (157/376/237 lineas) y su entrada stub en este indice
  # (status Draft, estimate 7, sin campos de fecha). Al planificar de nuevo se
  # sobrescribio. El plan anterior esta INTACTO en git (HEAD 0193e53) y respaldado en
  # openspec/changes/_backups/2026-08-20-US-007-carrito-compra-backend/. Los dos planes
  # convergen en lo esencial (token opaco hasheado, expires_at agregado al DER, creacion
  # perezosa, precios vigentes, AC-8 como invariante probada, purga oportunista); el
  # plan vigente agrega los controles §7 que faltaban (CSRF sobre cookie — §7.5 es
  # Mandatory —, Cache-Control: no-store, DELETE en la allowlist de metodos CORS sin el
  # cual el preflight del DELETE fallaba) y cambia la semantica de escritura a PUT
  # absoluto (idempotente por §10.5, sin Idempotency-Key). Decision de cual queda: del PO.
  # 7,7 h AI-asistido / ~15 h tradicional (24 tasks). US §7 presupuesta BE-US-007 en
  # 6-10 h: el tradicional excede el techo ~5 h por trabajo que la US da por resuelto al
  # describirla como "carrito CRUD con persistencia + chequeo de stock" — la identidad
  # del invitado (token opaco + cookie propia + CSRF sin `jti`, que el mecanismo de
  # US-014 no cubre) y los controles §7 de la PRIMERA superficie pública de escritura
  # del proyecto (tercer throttler nombrado + no-store también en 4xx/429 + PUT/DELETE
  # en CORS + extracción de verifyRequestOrigin). El CRUD en sí son ~3 h.
  # Sin ADR nuevo: ADR-0008 gobierna stock (el carrito no reserva ni descuenta) y el
  # DER del E2E §8 ya declara CARTS/CART_ITEMS. Las dos desviaciones del DER
  # (session_token → session_token_hash; expires_at/updated_at) se declaran en design.md.
  # 6 preguntas abiertas para el PO, NINGUNA bloquea el arranque: todas tienen default
  # implementado (retención 30 d, max_quantity sólo en el carrito, fusión diferida por
  # la US §4, total sin líneas bloqueadas, PUT absoluto idempotente, purga oportunista).
  estimate-hours: 7.7
  assignee: bce7ffb7
