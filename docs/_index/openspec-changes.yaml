# qa-plan.md agregado 2026-08-23 por /plan-qa (BDD + contract + k6 webhook + E2E loop completo)
- name: US-010-orden-webhook-stock-backend
  us-id: US-010
  discipline: backend
  variant: null
  status: draft
  parent-us: docs/user-stories/US-010-orden-webhook-stock.md
  linear-task-id: null
  audit-baseline: null
  audit-derived: false
  # 13,6 h AI-asistido / ~26 h tradicional (26 tasks, suma de las 9 fases). US §7 presupuesta
  # BE-US-010 en 16-24 h —es la task mas grande del proyecto y la US ya lo sabia—; el
  # tradicional excede el techo ~2 h por tres cosas que la US menciona en una linea cada una:
  # (a) «se disparan las notificaciones» (AC-2) NO TIENE COLA: Redis sigue sin aprovisionar,
  #     cuarta instancia del desvio de ADR-0012/0014 (las otras tres: import US-006,
  #     enriquecimiento US-005, cache de busqueda US-004). Hace falta NotificationPort +
  #     adaptador de log; US-011 pone la implementacion real.
  # (b) «corre la reconciliacion» (AC-10) y «corre el job de limpieza» (AC-11) NO TIENEN
  #     PLANIFICADOR: no hay @nestjs/schedule ni nada de scheduling en apps/api. Dos runners
  #     en proceso + dos endpoints admin — que es literalmente lo que el runbook del E2E
  #     §18.5 pide («job/endpoint manual idempotente»).
  # (c) el REEMBOLSO DURABLE de AC-4 necesita un estado persistido (payments.status gana
  #     `refund_pending`) y un runner de reintentos: perder un reembolso en memoria es perder
  #     plata de un cliente.
  # La transaccion del camino feliz son ~1,5 h. El resto es condicion adversa, que es donde
  # esta el valor: SIETE de los once AC son negative space.
  #
  # DECISIONES QUE VALE MIRAR:
  # - IDEMPOTENCIA POR LA BASE, NO POR UN `if`: SELECT ... FOR UPDATE sobre la fila del pago
  #   dentro de la transaccion, y solo la transicion pending → approved hace trabajo. Un
  #   check-then-act se rompe con dos webhooks concurrentes, que es exactamente lo que hace un
  #   proveedor que reintenta. T6.1 lo prueba con 10 requests en Promise.all — un
  #   check-then-act NO pasaria ese test.
  # - ITEMS ORDENADOS POR product_id en el decremento: sin eso, dos ordenes que comparten
  #   productos A y B en orden inverso se abrazan en un deadlock. Falla solo bajo concurrencia,
  #   en produccion, y en los logs se ve como un error de Postgres sin relacion con el negocio.
  # - EL WEBHOOK NO LLEVA THROTTLER, a proposito: limitar por IP la puerta por la que entra el
  #   dinero significa DESCARTAR PAGOS cuando el proveedor reintenta en rafaga. La proteccion
  #   es la firma (rechazar cuesta un HMAC) y que nada no verificado toca la base.
  # - SIEMPRE 200 SALVO FIRMA INVALIDA: MP reintenta ante cualquier no-2xx, asi que un 500 por
  #   un bug nuestro desata una tormenta justo cuando el sistema esta mal. Un fallo transitorio
  #   queda para la reconciliacion, que es el mecanismo pensado para eso.
  # - LA VERIFICACION DE FIRMA TIENE VENTANA DE ts (5 min): sin ella, un webhook legitimo
  #   capturado se puede reproducir para siempre porque la firma sigue siendo valida.
  #
  # SEAMS: extiende el MercadoPagoClient de US-009 con getPayment (la re-consulta de AC-7) y
  # refund (AC-4) sobre el adaptador que ya tiene timeout/reintentos/breaker — NO se crea un
  # segundo cliente HTTP, y con eso US-013 encuentra la capacidad de reembolso ya construida y
  # probada. Y T2.4 reemplaza NoopPaymentConfirmation por ConfirmOrderService: es el punto de
  # extension que US-009 diseño, y lo que vuelve AC-9 estructural (el medio simulado confirma
  # de verdad sin que su codigo cambie — un solo camino, no dos).
  #
  # DEVIACIONES DECLARADAS del DER (E2E §8): payments.status gana `refund_pending` en su CHECK;
  # orders gana confirmed_at y cancelled_at (la FSM §12 tiene seis estados y el DER solo modela
  # delivered_at — sin confirmed_at no hay insumo para US-016). Todas aditivas.
  # Sin ADR nuevo: ADR-0008 gobierna el decremento, ADR-0006 el webhook verificado.
  #
  # ORDEN DE DESPLIEGUE NO NEGOCIABLE: US-008 → US-009 → US-010. Secreto nuevo:
  # MP_WEBHOOK_SECRET (el arranque falla en produccion sin el). Este change es el que CONTESTA
  # la URL publica del webhook que INFRA-US-009 provisiona: mal configurada, los pagos se
  # cobran y las ordenes no se confirman, y el defecto se ve como «vendi y no me aparecio el
  # pedido». Se recomienda /plan-deployment CONJUNTO para US-008 + US-009 + US-010.
  # OJO con el rollback: revertir con pagos ya aprobados en MP deja ordenes cobradas sin
  # confirmar — la reconciliacion las recupera al volver a desplegar, es su escenario.
  #
  # 5 preguntas abiertas, ninguna bloquea el arranque. La que conviene cerrar antes: OQ-BE-1
  # (plazo de abandono, 48 h) porque interactua con el vencimiento de 24 h de la preferencia
  # de MercadoPago que fijo US-009.
  estimate-hours: 13.6
  assignee: sin-asignar  # planificado, 0 tasks cerradas: nadie lo ejecuta todavia
