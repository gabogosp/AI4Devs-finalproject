  # 10,1 h AI-asistido / ~20 h tradicional (22 tasks + 2 pre-requisitos). US §7 presupuesta
  # FE-US-014 en 8-12 h tradicional: se excede ~8 h con causa nombrada en tasks.md §"Por qué el
  # plan excede el presupuesto". La US pricing-eó "formularios de auth" (Fases 3-4, ~8 h trad,
  # entra cómodo) y se escribió ANTES de que el backend eligiera cookies HttpOnly + refresh
  # rotado. Lo no presupuestado: (1) topología same-origin — `up.railway.app` está en la Public
  # Suffix List, así que web y API son SITIOS DISTINTOS y las cookies SameSite=Lax nunca
  # viajarían (en local funciona, en producción no: defecto invisible hasta el despliegue);
  # (2) dos modelos de auth conviviendo en el único choke point de red (F48); (3) refresh
  # single-flight cross-tab — sin coalescing, la rotación single-use de ADR-0011 hace que el
  # propio FE desloguee al usuario legítimo; (4) superficie /v1/auth/* en el stub E2E con
  # Set-Cookie real; (5) las cuatro garantías de la Fase 4 (AC-5/AC-8/AC-9 son propiedades de
  # SEGURIDAD: verdaderas hoy no alcanza, tienen que quedar protegidas).
  # BLOQUEANTES al cerrar el planning (ambos en rojo, a propósito):
