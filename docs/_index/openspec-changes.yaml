- name: US-004-busqueda-semantica-backend
  us-id: US-004
  discipline: backend
  variant: null
  # `completed` es el valor del enum del schema. (Otras entradas usan `in progress` con espacio,
  # que NO está en el enum: deriva preexistente, no se toca desde acá.)
  status: archived
  parent-us: docs/user-stories/US-004-busqueda-semantica.md
  linear-task-id: null
  audit-baseline: null
  audit-derived: false
  # 10,4 h AI-asistido / ~20 h tradicional (23 tasks, suma de las 8 fases). US §7
  # presupuesta BE-US-004 en 12-16 h: el AI-asistido entra cómodo; el tradicional excede el
  # techo ~4 h por dos cosas que la US menciona al pasar y son trabajo real —
  # (a) EL FULL-TEXT NO EXISTE: AC-4 exige degradar a búsqueda por texto y no hay una sola
  #     columna tsvector ni un índice GIN en todo el esquema. Este change es dueño de esa
  #     migración (columna GENERATED ALWAYS AS ... STORED con configuración 'spanish' sobre
  #     name + description_enriched + sku, más índice GIN). Generada y no por trigger: una
  #     columna generada no puede quedar desincronizada.
  # (b) EL CACHÉ DE REDIS NO SE PUEDE CONSTRUIR: la US §9 y el E2E §17 piden «cache de
  #     consultas frecuentes (Redis)» y Redis no está aprovisionado (ADR-0012 y ADR-0014 ya
  #     enmendaron ADR-0004 dos veces por lo mismo; US-019 T1.3 sigue abierta). Tercera vez
  #     que el proyecto paga este desvío: caché en proceso con el seam intacto. Se cachea EL
  #     VECTOR y no los resultados, para que un cambio de precio/stock se vea en la
  #     siguiente búsqueda en vez de esperar el TTL.
  # El kNN en sí, con el HNSW que US-005 ya creó, son ~2 h.
  #
  # ⚠ BLOQUEANTE DE VIABILIDAD — OQ-BE-1: EL TECHO DE 15 RPM.
  # US-005 implementa el limitador del proveedor como SERIALIZADOR DE INTERVALO MÍNIMO
  # (60_000 / GEMINI_MAX_RPM). Con el default de 15 RPM del free tier eso es UNA LLAMADA CADA
  # 4 SEGUNDOS —casi 3× el presupuesto TOTAL de la búsqueda (p95 < 1,5 s, PRD §4)— y, peor,
  # 15 BÚSQUEDAS POR MINUTO PARA TODO EL SITIO, contra los ~50 concurrentes en pico que
  # dimensiona el E2E §17. La suposición §21 del E2E («Gemini tiene cuota/rate-limit
  # suficiente») NO CUBRÍA EL CAMINO INTERACTIVO y este plan la invalida.
  # Este diseño hace el techo configurable y visible (limitador + timeout propios para
  # búsqueda, reusando el puerto AI_EMBEDDER pero NO la política de tasa), pero repartir 15
  # RPM entre dos consumidores no arregla la aritmética. La decisión —tier pago vs aceptar el
  # techo— es de producto y tiene costo. Recomendación: (a) tier pago + presupuesto propio.
  #
  # SEAM CON US-005: se REUSA el puerto AI_EMBEDDER (no se duplica el cliente de Gemini, ni
  # la redacción de la API key, ni el parseo). T1.1 lo MUEVE de src/enrichment/ports/ a
  # src/ai/ports/ porque con dos consumidores su dueño natural deja de ser enrichment — el
  # mismo criterio que US-005 dejó escrito para EnrichmentQueue. Los specs de US-005 tienen
  # que pasar SIN EDITARSE. US-005 va 1/28 tasks: su migración de product_embeddings + HNSW
  # ya está aplicada (pero SIN COMMITEAR), el resto está en vuelo.
  #
  # AC-2 (relevancia ≥ 70%) NO QUEDA VERIFICADO por este change: no se puede medir hasta que
  # US-005 pueble embeddings. Se entrega el ARNÉS ejecutable (script + gate por exit code +
  # 8 casos semilla + reporte de cobertura de embeddings, para que un 0% por catálogo vacío
  # no se lea como problema de relevancia). La batería completa de ~30 y el gate son de QA
  # (US §7, E2E §19). Deferred: /plan-qa US-004 — owner: QA.
  #
  # DECISIONES QUE VALE MIRAR: interpreted_as se DERIVA de las categorías que matchearon en
  # vez de generarse con el LLM (OQ-BE-3) — ahorra latencia y, sobre todo, hace que NINGÚN
  # texto del usuario llegue a un modelo generativo, volviendo AC-8 estructural en vez de una
  # promesa con filtros. El fallo del proveedor es un 200 DEGRADADO y no un 5xx (AC-4): un
  # buscador que devuelve 5xx en una ráfaga le enseña a Google a sacar URLs del índice, la
  # lección que US-003 ya pagó con el 429. El blend léxico queda detrás de
  # SEARCH_LEXICAL_WEIGHT=0 para que la batería lo calibre en vez de que este plan lo adivine.
  #
  # Deviación del DER (E2E §8): products.search_document (tsvector). Es una columna derivada
  # que exige AC-4, no un dato nuevo; el DER no baja a la estrategia de consulta.
  # Sin ADR nuevo: ADR-0002 fija pgvector+HNSW, ADR-0003 el proveedor, ADR-0012/0014 el
  # patrón en proceso.
  #
  # DEPLOYMENT: coordinar con el plan de US-005, no uno propio. Sin secreto nuevo (reusa
  # GEMINI_API_KEY) pero 13 variables nuevas. El ALTER TABLE ... ADD COLUMN ... GENERATED
