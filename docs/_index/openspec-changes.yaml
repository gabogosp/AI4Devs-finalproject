  #     cierra diciendo «Inherited by: US-007 (cart, if it moves to a cookie-authenticated
  #     surface)» — y lo es (dsm_cart httpOnly + dsm_cart_csrf legible). Sin extender el
  #     rewrite el carrito funciona en local y ESTÁ ROTO EN PRODUCCIÓN, con el peor perfil
  #     de defecto: invisible hasta el deploy. De ahí el E2E contra la app construida
  #     (T5.1), espejo de auth-topology.spec.ts.
  # (b) SEGUNDO SUJETO DE CSRF: csrf.ts es «el único lector de document.cookie de la app»
  #     con la cookie hardcodeada a dsm_csrf (US-014). El invitado tiene carrito sin tener
  #     sesión, así que los dos sujetos coexisten. Se parametriza el sujeto, NO se duplica
