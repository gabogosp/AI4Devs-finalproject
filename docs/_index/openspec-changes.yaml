  #             después es una migración con sequence.
  #   OQ-BE-5 — retención/borrado de la PII del comprador INVITADO. El PRD §6 fija 12
  #             meses + anonimización y NINGUNA US lo implementa (US-020 cubre sólo
  #             cuentas registradas). Es exposición legal (Ley 25.326), no deuda técnica
  #             cosmética: la recomendación es abrir una US de retención antes de
  #             producción.
  #
  # DEPLOYMENT: no requiere /plan-deployment propio (migración aditiva, sin secretos
  # nuevos, sin feature flag), pero SÍ conviene coordinarlo con el de US-009 — este
  # change cambia el perfil de riesgo del proyecto al introducir PII en reposo, y su
