- name: US-009-pago-mercadopago-backend
  us-id: US-009
  discipline: backend
  variant: null
  status: draft
  parent-us: docs/user-stories/US-009-pago-mercadopago.md
  linear-task-id: null
  audit-baseline: null
  audit-derived: false
  # 9,8 h AI-asistido / ~19 h tradicional (28 tasks). US §7 presupuesta BE-US-009 en
  # 10-16 h: el tradicional excede el techo ~3 h por trabajo que la US da por resuelto
  # al describirlo como «integración con MercadoPago + medio simulado detrás de flag» —
  # la PRIMERA llamada saliente del camino crítico del proyecto (timeout + reintentos +
  # backoff con jitter + circuit breaker + adaptador falso, ~3,5 h de las cuales la US
  # no presupuesta ninguna, porque en apps/api hoy no existe un solo control de
  # resiliencia del que copiar: el único adaptador externo, ResendMailer de US-014, corre
  # fuera del camino de respuesta), y las DOS capas del flag del simulado en vez de un
  # `if` en el handler (montaje condicional del controller + fallo de arranque en
  # producción). La integración en sí —preferencia, init_point, retorno— son ~4 h.
  #
  # BLOQUEANTE al cerrar el planning (en rojo, a propósito): US-008 backend NO ESTÁ
  # PLANIFICADO. Este change lee `orders`/`order_items` y no los crea, y necesita del
  # contrato de US-008 una columna `orders.access_token_hash` + un `order_token` opaco
  # en el 201 de POST /v1/checkout. Es la única obligación que US-009 impone a una US
  # todavía sin planificar (OQ-BE-1) y conviene ratificarla con el Arquitecto antes de
  # ejecutar: rehacer el seam después cuesta más que decidirlo ahora.
  #
  # ALCANCE: la tabla `payments` es de este change; `orders`/`order_items` son de US-008;
  # el webhook, la confirmación de la orden y el decremento de stock son de US-010
  # (ADR-0008). Se deja el seam `PaymentConfirmationPort` con un adaptador no-op, así que
  # al cerrar este change un pago aprobado NO confirma la orden — estado intermedio
