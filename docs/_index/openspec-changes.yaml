  # tablas con 9 constraints y 5 deviaciones declaradas del DER, tres de ellas por
  # exigencia de AC-8 (el DER modela el consentimiento como un booleano y el AC pide
  # marca temporal y trazabilidad legal); (b) es la PRIMERA PII EN REPOSO del proyecto,
  # lo que convierte §9 de observability-standards en una fase propia con guardián
  # automático en vez de una nota al pie; (c) el seam con el carrito exige tocar el
  # wiring de CartModule, que hoy sólo exporta CartEventsService. El caso de uso en sí
  # —validar, snapshotear, insertar— son ~4 h.
  #
  # DESBLOQUEA A US-009: este plan RESUELVE OQ-BE-1 del change de pagos entregando
  # `orders.access_token_hash` + el `order_token` (hex de 64) en el 201 de POST
  # /v1/checkout, con la forma exacta que su contrato declara. Al cerrar T0.1 + T2.3,
  # US-009-pago-mercadopago-backend queda ejecutable; T6.3 cierra formalmente la OQ en
  # el proposal de ese change. Orden de despliegue no negociable: US-008 → US-009.
  #
  # ALCANCE: `orders` + `order_items` son de este change; `payments` es de US-009; la
  # confirmación, el decremento de stock y la limpieza de órdenes abandonadas son de
  # US-010 (ADR-0008). La orden nace INERTE: no retiene stock, no mueve plata y es
  # invisible para el panel del dueño (pending_payment). `delivered_at` y `customer_id`
  # se crean por el DER y quedan SIN ESCRITOR (US-012 y US-015).
  #
  # DEVIACIONES DECLARADAS en design.md: 5 columnas sobre el DER del E2E §8 —
  # access_token_hash (el seam de US-009), consent_accepted_at + consent_terms_version
  # (AC-8 pide marca temporal y trazabilidad legal; el DER sólo tiene el booleano),
  # orders.updated_at, y order_items.product_name + product_sku (la orden es un registro
  # comercial: renombrar un producto no puede reescribir el email de US-011 ni el panel
  # de US-012) — más CHECK (consent_accepted = true), que hace estructuralmente imposible
  # una orden sin consentimiento, y la ausencia de Idempotency-Key (deviación de
  # api-standards §10.1: el recurso creado es inerte, el riesgo que §10 protege es el
  # doble cobro y acá no hay cobro; cualquier forma de reuso acoplaría este change con el
  # de pagos en ambos sentidos). Sin ADR nuevo: ADR-0008 gobierna el stock, ADR-0006 la
  # ausencia de datos de tarjeta.
