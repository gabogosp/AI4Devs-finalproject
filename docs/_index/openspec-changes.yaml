  # DECISIONES DEL PO (2026-08-22): OQ-BE-1 opción (a) — doble submit crea DOS órdenes
  # inertes, sin acoplar con US-009. OQ-BE-4 opción (a) — se agrega `orders.order_number`
  # (int UNIQUE, SEQUENCE START WITH 1000) AHORA: después sería un ALTER con backfill sobre
  # órdenes reales, y arrancar en 1000 evita que un «Pedido #3» le informe al comprador que
  # la tienda vendió dos veces (PRD §1.3 — confianza = conversión). Va en el 201 y en el
