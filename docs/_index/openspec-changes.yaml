  # 10,4 h AI-asistido / ~20 h tradicional (24 tasks). US §7 presupuesta FE-US-007 en
  # 8-12 h: el tradicional excede el techo ~8 h por trabajo que la US da por resuelto al
  # describirlo como «vista de carrito con stepper y persistencia» —
  # (a) TOPOLOGÍA DE COOKIES: ADR-0013 existe porque up.railway.app está en la Public
  #     Suffix List y hoy el rewrite same-origin cubre SÓLO /v1/auth/*. El propio ADR
  #     cierra diciendo «Inherited by: US-007 (cart, if it moves to a cookie-authenticated
  #     surface)» — y lo es (dsm_cart httpOnly + dsm_cart_csrf legible). Sin extender el
  #     rewrite el carrito funciona en local y ESTÁ ROTO EN PRODUCCIÓN, con el peor perfil
  #     de defecto: invisible hasta el deploy. De ahí el E2E contra la app construida
  #     (T5.1), espejo de auth-topology.spec.ts.
  # (b) SEGUNDO SUJETO DE CSRF: csrf.ts es «el único lector de document.cookie de la app»
  #     con la cookie hardcodeada a dsm_csrf (US-014). El invitado tiene carrito sin tener
  #     sesión, así que los dos sujetos coexisten. Se parametriza el sujeto, NO se duplica
  #     el parser, y el default preserva el comportamiento de US-014 (sus specs corren sin
  #     editarse o el refactor está mal).
  # (c) EL CARRITO NO PUEDE RENDERIZARSE EN SERVIDOR: client.ts LANZA si una llamada con
  #     sesión sale del servidor, y ese guard es load-bearing (evita que un dato
  #     personalizado entre a la Data Cache de Next y se le sirva a otra persona — US-014
  #     design.md D3). Consecuencia: /carrito es Client Component + noindex, y el badge del
  #     top-nav es una ISLA CLIENTE dentro de un layout que sigue siendo Server Component
  #     (CategoryNav lo necesita para el SEO de US-002).
  # (d) TRES SUPERFICIES YA ENTREGADAS que hay que modificar sin romperlas: el layout del
  #     storefront (US-002/US-018), ProductPurchase (US-003, que hoy renderiza el botón
  #     disabled como señal de roadmap) y ProductCard (US-002).
  # La vista en sí —lista, stepper, totales, vacío— son ~5 h.
  #
  # ÚNICA EXCEPCIÓN al «tests existentes sin editar»: ProductPurchase.test.tsx se reescribe
  # (T3.4). Asserta que el botón está disabled — es un test de un cartel de roadmap que este
  # change apaga. Está nombrada en el plan, no es un descuido.
  #
  # ALCANCE: el CTA «Ir al pago» queda DESHABILITADO con el motivo a la vista hasta que
  # US-008 FE construya /checkout (Deferred: US-008 — owner: FE). El resto del carrito es
  # plenamente funcional. El buscador del top-nav sigue Deferred: US-004.
  #
  # CONTRATO: cero DTOs/Zod/MSW escritos a mano — frontend-standards §3.1/§3.2 es Mandatory
  # y orval ya está configurado con el mutator customFetch. Los tres endpoints del carrito
  # YA están publicados en apps/api/docs/api/openapi.yaml (el backend cerró 24/24), así que
  # T0.1 es regenerar, no esperar. El gate frontend-codegen-fresh custodia el drift y T0.2
  # comprueba que el gate MUERDE (introduce drift a propósito y verifica que falla).
  #
  # Sin ADR nuevo: ADR-0013 gobierna la topología, ADR-0008 el que la UI no prometa stock.
  #
  # 5 preguntas abiertas, NINGUNA bloquea el arranque (todas con default implementado).
  # La única que cambia el ALCANCE es OQ-FE-2 (¿«Agregar» en la card del listado?): AC-1
  # dice «desde la ficha o el listado», pero es lo único que modifica una superficie
  # entregada más allá del wiring. Si el PO dice «sólo la ficha», cae T3.5.
  # Las otras cuatro: stepper pesimista con debounce 400 ms (OQ-FE-1), la UI no auto-ajusta
  # cantidades de líneas bloqueadas (OQ-FE-3), el badge cuenta unidades (OQ-FE-4), y
  # /carrito no funciona sin JS (OQ-FE-5 — soportarlo exigiría relajar el guard de D3).
  #
  # DEPLOYMENT: no requiere /plan-deployment propio (sin secretos, sin migraciones, sin
