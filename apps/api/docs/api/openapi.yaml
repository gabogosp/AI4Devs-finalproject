openapi: 3.0.3
info:
  title: DSM — API de administración del catálogo (US-001)
  version: 1.0.0
  description: >-
    Panel del dueño: categorías y productos, máquina de estado y RBAC admin.
    Errores en envelope RFC 7807 (`application/problem+json`, `type` `dsm:catalog/*`).
  contact:
    name: DSM
    url: https://example.com
servers:
  - url: /v1
    description: Base URL versionada
tags:
  - name: admin-auth
    description: Seam de login admin (AC-8, ADR-0009)
  - name: admin-categories
    description: Gestión de categorías (AC-1)
  - name: admin-products
    description: Gestión de productos (AC-2..AC-9)
  - name: storefront-products
    description: Superficie pública de lectura del storefront (ficha de producto, US-003)
  - name: storefront-categories
    description: Superficie pública de navegación por categorías (US-002)
  - name: health
    description: Liveness / readiness
security:
  - adminBearer: []
paths:
  /admin/auth/login:
    post:
      tags: [admin-auth]
      summary: Login admin — intercambia el bootstrap token por un JWT (AC-8)
      description: >-
        Costura HTTP del seam de auth admin (ADR-0009). Única ruta bajo
        `/v1/admin/*` SIN `adminBearer`: es la que emite el token, exigirlo
        sería circular. US-014 la reemplaza preservando el contrato `role=admin`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLogin' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLoginResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429':
          description: >-
            Rate limit de la superficie de auth excedido (security-standards §7.3).
            Incluye `Retry-After` y las cabeceras `RateLimit-*` (api-standards §12).
          headers:
            Retry-After: { schema: { type: integer }, description: Segundos hasta reintentar }
            RateLimit-Limit: { schema: { type: integer } }
            RateLimit-Remaining: { schema: { type: integer } }
            RateLimit-Reset: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /admin/categories:
    post:
      tags: [admin-categories]
      summary: Crear categoría (AC-1)
      description: Crea una categoría; el slug se deriva del nombre (único).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategory' }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      tags: [admin-categories]
      summary: Listar categorías (AC-1)
      description: Devuelve todas las categorías.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/categories/{id}:
    patch:
      tags: [admin-categories]
      summary: Editar categoría (AC-1)
      description: Actualiza el nombre/parent de una categoría.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategory' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/products:
    post:
      tags: [admin-products]
      summary: Crear producto en draft (AC-2, AC-5, AC-9)
      description: Alta en estado draft; SKU único; validación por campo (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProduct' }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      tags: [admin-products]
      summary: Listar productos (paginado, NFR)
      description: Listado paginado del panel (limit/offset).
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProductList' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/products/{id}:
    get:
      tags: [admin-products]
      summary: Obtener producto (AC-3)
      description: Devuelve un producto por id.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [admin-products]
      summary: Editar o cambiar estado (AC-3, AC-4, AC-6, AC-7)
      description: >-
        Sin `status`: edita campos (AC-3). Con `status`: transición de estado
        (publicar/archivar/despublicar); publicar incompleto → 422 y permanece draft.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProduct' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /products/{slug}:
    get:
      operationId: storefrontGetProduct
      tags: [storefront-products]
      summary: Ficha pública de producto publicado (US-003 AC-1/AC-2)
      description: >-
        Ruta PÚBLICA `GET /v1/products/{slug}` SIN auth (la primera del servicio).
        Devuelve un producto sólo si está `published`; draft/archived/inexistente →
        404 uniforme (AC-7/AC-8, sin enumeration leak). Identificador público: `slug`
        (URL amigable indexable, AC-1 — OQ-BE-1 resuelta en la Fase 10; el `slug` lo
        deriva el servidor del `name`, nunca se acepta del cliente). Rate-limit por IP
        (§7.3, 429 + `Retry-After`) y `Cache-Control` acotado (AC-9).
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: 'URL amigable del producto (kebab-case, derivada del nombre).'
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
      responses:
        '200':
          description: Ficha del producto publicado (campos SEO-relevantes)
          headers:
            Cache-Control:
              schema: { type: string }
              description: 'public, max-age=60, stale-while-revalidate=30 (AC-9)'
          content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontProduct' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429':
          description: Rate limit por IP excedido (§7.3). Incluye Retry-After y RateLimit-*.
          headers:
            Retry-After: { schema: { type: integer } }
            RateLimit-Limit: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /categories:
    get:
      operationId: storefrontListCategories
      tags: [storefront-categories]
      summary: Árbol público de categorías de dos niveles (US-002 AC-1)
      description: >-
        Ruta PÚBLICA SIN auth. Rubros (sin padre) con sus subrubros directos,
        ambos ordenados por nombre. TTL propio de 300s (decisión D5) porque el
        árbol cambia poco. No emite `category.viewed` (sólo el detalle, D4).
      security: []
      responses:
        '200':
          description: Árbol de navegación
          headers:
            Cache-Control:
              schema: { type: string }
              description: 'public, max-age=300, stale-while-revalidate=60 (D5)'
          content: { application/json: { schema: { $ref: '#/components/schemas/CategoryTree' } } }
        '429': { $ref: '#/components/responses/Problem' }
  /categories/{slug}:
    get:
      operationId: storefrontGetCategory
      tags: [storefront-categories]
      summary: Detalle público de una categoría (US-002 AC-1/AC-2/AC-9)
      description: >-
        Ruta PÚBLICA SIN auth. Trae `parent` para el breadcrumb y `children`
        para los subrubros. Slug inexistente → 404 (nunca un 200 vacío, que
        sería una página fantasma indexable). Único endpoint que emite el evento
        `category.viewed` (D4, insumo del panel US-016).
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
      responses:
        '200':
          description: Categoría con su padre y sus subrubros
          headers:
            Cache-Control:
              schema: { type: string }
              description: 'public, max-age=60, stale-while-revalidate=30'
          content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontCategory' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /categories/{slug}/products:
    get:
      operationId: storefrontListCategoryProducts
      tags: [storefront-categories]
      summary: Listado paginado de productos publicados de una categoría (US-002 AC-3)
      description: >-
        Ruta PÚBLICA SIN auth. Sólo `published` (AC-8: draft/archived nunca
        aparecen, ni en `data` ni en `total`). Un RUBRO agrega los productos de
        sus subrubros directos; un SUBRUBRO lista sólo los propios (decisión
        D1). Paginación offset con `total` (D3), `limit` 1..100 default 20 — el
        catálogo completo nunca se transfiere de una (AC-7). Orden estable
        `name ASC, id ASC`. Categoría existente sin publicados → 200 con `data`
        vacía (AC-6); categoría inexistente → 404 (AC-9).
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Página de productos publicados (puede ser vacía)
          headers:
            Cache-Control:
              schema: { type: string }
              description: 'public, max-age=60, stale-while-revalidate=30'
          content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontProductPage' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT con claim role=admin (seam ADR-0009)
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Error RFC 7807
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    AdminLogin:
      type: object
      required: [bootstrapToken]
      properties:
        bootstrapToken: { type: string, minLength: 1 }
    AdminLoginResponse:
      type: object
      required: [token]
      properties:
        token: { type: string, description: JWT con claim role=admin }
    CreateCategory:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        parent_id: { type: string, format: uuid, nullable: true }
    UpdateCategory:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        parent_id: { type: string, format: uuid, nullable: true }
    Category:
      type: object
      required: [id, slug, name, parent_id, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        parent_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    CreateProduct:
      type: object
      required: [sku, name, price_ars_cents, category_id]
      properties:
        sku: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        description_raw: { type: string, nullable: true }
        price_ars_cents: { type: integer, minimum: 1, description: Centavos ARS (IVA incluido) }
        stock: { type: integer, minimum: 0, default: 0 }
        category_id: { type: string, format: uuid }
        image_url: { type: string, nullable: true }
    UpdateProduct:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description_raw: { type: string, nullable: true }
        price_ars_cents: { type: integer, minimum: 1 }
        stock: { type: integer, minimum: 0 }
        category_id: { type: string, format: uuid }
        image_url: { type: string, nullable: true }
        status: { type: string, enum: [draft, published, archived] }
    Product:
      type: object
      required:
        [
          id,
          sku,
          slug,
          name,
          description_raw,
          price_ars_cents,
          stock,
          status,
          category_id,
          image_url,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        slug:
          type: string
          description: 'URL amigable de la ficha pública; el panel la usa para invalidar la caché del storefront tras mutar (product:{slug}).'
        name: { type: string }
        description_raw: { type: string, nullable: true }
        price_ars_cents: { type: integer }
        stock: { type: integer }
        status: { type: string, enum: [draft, published, archived] }
        category_id: { type: string, format: uuid }
        image_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    CategoryTreeNode:
      type: object
      description: 'Rubro con sus subrubros; sin `parent` (la jerarquía la da el anidamiento).'
      required: [slug, name, children]
      properties:
        slug: { type: string }
        name: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryRef' }
    CategoryTree:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CategoryTreeNode' }
    StorefrontCategory:
      type: object
      description: 'Categoría pública (US-002): sin id, parent_id ni timestamps.'
      required: [slug, name, parent, children]
      properties:
        slug: { type: string }
        name: { type: string }
        parent:
          type: object
          nullable: true
          description: 'Rubro padre para el breadcrumb; null si ya es raíz.'
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryRef' }
    StorefrontProductListItem:
      type: object
      description: 'Item de grilla (US-002): sin id, stock numérico, status ni timestamps.'
      required: [slug, name, price_ars_cents, currency, image_url, in_stock]
      properties:
        slug:
          type: string
          description: 'Enlaza a la ficha `/v1/products/{slug}`.'
        name: { type: string }
        price_ars_cents: { type: integer }
        currency: { type: string, enum: [ARS] }
        image_url: { type: string, nullable: true }
        in_stock: { type: boolean }
    StorefrontProductPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StorefrontProductListItem' }
        pagination:
          type: object
          required: [limit, offset, total]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total:
              type: integer
              description: 'Publicados que matchean el filtro, no los de la página.'
    StorefrontProduct:
      type: object
      description: 'Ficha pública (US-003): sólo campos SEO; sin id/stock/status/timestamps.'
      required: [slug, sku, name, description, price_ars_cents, currency, image_url, in_stock, category]
      properties:
        slug:
          type: string
          description: 'URL amigable canónica de la ficha (AC-1).'
        sku:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
          description: 'description_raw; US-005 antepondrá la enriquecida.'
        price_ars_cents:
          type: integer
          description: 'Centavos ARS, IVA incluido (AC-9).'
        currency:
          type: string
          enum: [ARS]
        image_url:
          type: string
          nullable: true
        in_stock:
          type: boolean
          description: 'Derivado de stock mayor a 0 (AC-3/AC-4); sin exponer el nivel.'
        category:
          type: object
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
    ProductList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        pagination:
          type: object
          required: [limit, offset, total]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total: { type: integer }
    Problem:
      type: object
      description: RFC 7807
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string, example: 'dsm:catalog/conflict' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
