openapi: 3.0.3
info:
  title: DSM — API de administración del catálogo (US-001)
  version: 1.0.0
  description: >-
    Panel del dueño: categorías y productos, máquina de estado y RBAC admin.
    Errores en envelope RFC 7807 (`application/problem+json`, `type` `dsm:catalog/*`).
  contact:
    name: DSM
    url: https://example.com
servers:
  - url: /v1
    description: Base URL versionada
tags:
  - name: admin-auth
    description: Seam de login admin (AC-8, ADR-0009)
  - name: admin-categories
    description: Gestión de categorías (AC-1)
  - name: admin-products
    description: Gestión de productos (AC-2..AC-9)
  - name: storefront-products
    description: Superficie pública de lectura del storefront (ficha de producto, US-003)
  - name: storefront-categories
    description: Superficie pública de navegación por categorías (US-002)
  - name: customer-auth
    description: >-
      Registro, sesión y recuperación de contraseña del cliente (US-014). Ningún
      token de sesión viaja en el cuerpo: se emiten sólo como cookies.
  - name: cart
    description: >-
      Carrito de compra del invitado (US-007). Superficie PÚBLICA y la primera de
      escritura sin autenticación. La identidad es la cookie `dsm_cart` (token
      opaco, guardado hasheado): no viaja en ningún cuerpo ni en ninguna URL. No
      reserva ni descuenta stock (AC-8, ADR-0008).
  - name: health
    description: Liveness / readiness
security:
  - adminBearer: []
paths:
  /auth/register:
    post:
      tags: [customer-auth]
      operationId: registerCustomer
      summary: Alta de cliente con sesión activa inmediata (AC-1)
      description: >-
        Sin verificación de email intermedia: la cuenta queda usable en el acto.
        Un email ya registrado devuelve 409 con un mensaje que NO confirma que la
        dirección exista (AC-6). Enviar `role`, `id` o `password_hash` devuelve
        422: no se ignoran.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Cliente creado y sesión abierta.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerEnvelope' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [customer-auth]
      operationId: loginCustomer
      summary: Login por credenciales (AC-2)
      description: >-
        Contraseña incorrecta, cuenta inexistente y cuenta bloqueada devuelven
        respuestas idénticas y con latencias del mismo orden (AC-5).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión abierta.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [customer-auth]
      operationId: refreshSession
      summary: Rota el refresh y renueva la sesión (ADR-0011)
      description: >-
        El refresh es de un solo uso. Presentar uno ya rotado se trata como robo:
        revoca la familia entera y devuelve el MISMO 401 que un token inexistente
        — distinguirlos le confirmaría al atacante que su réplica llegó. No exige
        access válido: ya venció, que es el motivo de llamar a esta ruta.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Sesión renovada.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [customer-auth]
      operationId: logoutCustomer
      summary: Cierra la sesión y revoca la familia de refresh (AC-3)
      description: >-
        Revocación inmediata del refresh. Cierra la familia del dispositivo
        actual; las otras sesiones del cliente siguen vivas. Límite declarado: el
        access ya emitido sigue siendo válido hasta que vence (≤
        AUTH_ACCESS_TTL_MIN), consecuencia aceptada de un access stateless.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: >-
            Sesión cerrada. Emite las tres cookies vencidas con el MISMO Path de
            emisión — dsm_refresh con Path=/v1/auth, porque con otro path el
            navegador la conservaría.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookies' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/me:
    get:
      tags: [customer-auth]
      operationId: getCurrentCustomer
      summary: Cliente de la sesión en curso
      description: >-
        Lee el access de la cookie dsm_access, no del header Authorization. Un
        token con role=admin NO abre esta ruta.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password-reset/request:
    post:
      tags: [customer-auth]
      operationId: requestPasswordReset
      summary: Solicita el enlace de recuperación (AC-11)
      description: >-
        SIEMPRE 202, con cuerpo y cabeceras idénticos exista o no la cuenta —
        incluido el Content-Length. Tampoco cambia si se superó el límite por
        cuenta ni si el proveedor de email falla: cualquier diferencia observable
        convertiría la ruta en un verificador de direcciones registradas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetRequest' }
      responses:
        '202': { description: Pedido aceptado. No informa si se envió algo. }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password-reset/confirm:
    post:
      tags: [customer-auth]
      operationId: confirmPasswordReset
      summary: Fija la contraseña nueva con el token del email (AC-4, AC-7)
      description: >-
        Completar el reset revoca TODAS las sesiones de la cuenta (§3.7), borra
        los demás tokens pendientes y levanta el bloqueo por intentos fallidos. NO
        emite sesión: devolver una dejaría viva justo la del que completó el
        flujo, y puede haberlo completado el atacante. Token inexistente, vencido
        o ya usado devuelven el mismo 400.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetConfirm' }
      responses:
        '200': { description: 'Contraseña cambiada. Sin Set-Cookie: no se abre sesión.' }
        '400': { $ref: '#/components/responses/Problem' }
        '422':
          description: >-
            La contraseña nueva viola la política. NO consume el token: un error
            de tipeo no debe obligar a pedir otro email.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/auth/login:
    post:
      tags: [admin-auth]
      summary: Login admin — bootstrap token o credenciales (AC-8, US-014 T8.1)
      description: >-
        Costura HTTP del seam de auth admin (ADR-0009). Única ruta bajo
        `/v1/admin/*` SIN `adminBearer`: es la que emite el token, exigirlo
        sería circular.


        US-014 agregó el login por `{email, password}` contra una cuenta con
        `role='admin'`, preservando la ruta, el transporte y la forma de la
        respuesta `{ token }` — el panel de US-001 no requirió cambios. El camino
        `{bootstrapToken}` sigue disponible detrás de `ADMIN_AUTH_ENABLED` como
        salida de emergencia. Con credenciales, la respuesta además emite las
        cookies de sesión. Las credenciales de una cuenta que existe pero NO es
        admin devuelven el mismo 401 que una contraseña incorrecta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLogin' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLoginResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429':
          description: >-
            Rate limit de la superficie de auth excedido (security-standards §7.3).
            Incluye `Retry-After` y las cabeceras `RateLimit-*` (api-standards §12).
          headers:
            Retry-After: { schema: { type: integer }, description: Segundos hasta reintentar }
            RateLimit-Limit: { schema: { type: integer } }
            RateLimit-Remaining: { schema: { type: integer } }
            RateLimit-Reset: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /admin/categories:
    post:
      tags: [admin-categories]
      summary: Crear categoría (AC-1)
      description: Crea una categoría; el slug se deriva del nombre (único).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategory' }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      tags: [admin-categories]
      summary: Listar categorías (AC-1)
      description: Devuelve todas las categorías.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/categories/{id}:
    patch:
      tags: [admin-categories]
      summary: Editar categoría (AC-1)
      description: Actualiza el nombre/parent de una categoría.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategory' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/products:
    post:
      tags: [admin-products]
      summary: Crear producto en draft (AC-2, AC-5, AC-9)
      description: Alta en estado draft; SKU único; validación por campo (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProduct' }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      tags: [admin-products]
      summary: Listar productos (paginado, NFR)
      description: Listado paginado del panel (limit/offset).
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProductList' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/products/{id}:
    get:
      tags: [admin-products]
      summary: Obtener producto (AC-3)
      description: Devuelve un producto por id.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [admin-products]
      summary: Editar o cambiar estado (AC-3, AC-4, AC-6, AC-7)
      description: >-
        Sin `status`: edita campos (AC-3). Con `status`: transición de estado
        (publicar/archivar/despublicar); publicar incompleto → 422 y permanece draft.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProduct' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /products/{slug}:
    get:
      operationId: storefrontGetProduct
      tags: [storefront-products]
      summary: Ficha pública de producto publicado (US-003 AC-1/AC-2)
      description: >-
        Ruta PÚBLICA `GET /v1/products/{slug}` SIN auth (la primera del servicio).
        Devuelve un producto sólo si está `published`; draft/archived/inexistente →
        404 uniforme (AC-7/AC-8, sin enumeration leak). Identificador público: `slug`
        (URL amigable indexable, AC-1 — OQ-BE-1 resuelta en la Fase 10; el `slug` lo
        deriva el servidor del `name`, nunca se acepta del cliente). Rate-limit por IP
        (§7.3, 429 + `Retry-After`) y `Cache-Control` acotado (AC-9).
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: 'URL amigable del producto (kebab-case, derivada del nombre).'
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
      responses:
        '200':
          description: Ficha del producto publicado (campos SEO-relevantes)
          headers:
            Cache-Control:
              schema: { type: string }
              description: 'public, max-age=60, stale-while-revalidate=30 (AC-9)'
          content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontProduct' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429':
          description: Rate limit por IP excedido (§7.3). Incluye Retry-After y RateLimit-*.
          headers:
            Retry-After: { schema: { type: integer } }
            RateLimit-Limit: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /categories:
    get:
      operationId: storefrontListCategories
      tags: [storefront-categories]
      summary: Árbol público de categorías de dos niveles (US-002 AC-1)
      description: >-
        Ruta PÚBLICA SIN auth. Rubros (sin padre) con sus subrubros directos,
        ambos ordenados por nombre. TTL propio de 300s (decisión D5) porque el
        árbol cambia poco. No emite `category.viewed` (sólo el detalle, D4).
      security: []
      responses:
        '200':
          description: Árbol de navegación
          headers:
            Cache-Control:
              schema: { type: string }
              description: 'public, max-age=300, stale-while-revalidate=60 (D5)'
          content: { application/json: { schema: { $ref: '#/components/schemas/CategoryTree' } } }
        '429': { $ref: '#/components/responses/Problem' }
  /categories/{slug}:
    get:
      operationId: storefrontGetCategory
      tags: [storefront-categories]
      summary: Detalle público de una categoría (US-002 AC-1/AC-2/AC-9)
      description: >-
        Ruta PÚBLICA SIN auth. Trae `parent` para el breadcrumb y `children`
        para los subrubros. Slug inexistente → 404 (nunca un 200 vacío, que
        sería una página fantasma indexable). Único endpoint que emite el evento
        `category.viewed` (D4, insumo del panel US-016).
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
      responses:
        '200':
          description: Categoría con su padre y sus subrubros
          headers:
            Cache-Control:
              schema: { type: string }
              description: 'public, max-age=60, stale-while-revalidate=30'
          content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontCategory' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /categories/{slug}/products:
    get:
      operationId: storefrontListCategoryProducts
      tags: [storefront-categories]
      summary: Listado paginado de productos publicados de una categoría (US-002 AC-3)
      description: >-
        Ruta PÚBLICA SIN auth. Sólo `published` (AC-8: draft/archived nunca
        aparecen, ni en `data` ni en `total`). Un RUBRO agrega los productos de
        sus subrubros directos; un SUBRUBRO lista sólo los propios (decisión
        D1). Paginación offset con `total` (D3), `limit` 1..100 default 20 — el
        catálogo completo nunca se transfiere de una (AC-7). Orden estable
        `name ASC, id ASC`. Categoría existente sin publicados → 200 con `data`
        vacía (AC-6); categoría inexistente → 404 (AC-9).
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Página de productos publicados (puede ser vacía)
          headers:
            Cache-Control:
              schema: { type: string }
              description: 'public, max-age=60, stale-while-revalidate=30'
          content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontProductPage' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Carrito del invitado con precios vigentes y disponibilidad (US-007 AC-4/AC-6/AC-7/AC-9)
      description: >-
        Ruta PÚBLICA SIN auth. Operación **segura**: no crea carrito, no emite
        cookie y no desliza la ventana de retención. Sin cookie `dsm_cart`, con una
        cookie huérfana o con la fila vencida devuelve el carrito VACÍO con 200
        (AC-7) — `id: null`, `items: []`, contadores en 0 y `updated_at: null`; la
        fila vencida se purga en el acto. Cada lectura recalcula precio y
        disponibilidad contra `products` (AC-6/AC-9), así que una línea
        despublicada o sin stock suficiente aparece marcada y fuera del total, no
        borrada. `Cache-Control: no-store` en toda la superficie.
      security: []
      responses:
        '200':
          description: Carrito del invitado (vacío si no hay cookie)
          headers:
            Cache-Control:
              schema: { type: string }
              description: 'Siempre no-store (§7.1): sin esto AC-9 se cae en el edge.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CartEnvelope' } } }
        '429': { $ref: '#/components/responses/CartRateLimited' }
  /cart/items/{slug}:
    put:
      operationId: setCartItem
      tags: [cart]
      summary: Fija la cantidad ABSOLUTA de un producto en el carrito (AC-1/AC-2/AC-5/AC-10)
      description: >-
        Ruta PÚBLICA SIN auth. El cuerpo fija la cantidad, no la suma: la operación
        es naturalmente idempotente (api-standards §10.5) y por eso no hay
        `Idempotency-Key`. Crea la línea si no existe, y crea el carrito + emite las
        cookies si no había. Orden de validación producto → stock → carrito, así que
        un rechazo NO escribe nada. `quantity` mayor al stock → 409
        `dsm:cart/insufficient-stock` con `available_quantity` (AC-5); el stock NO
        se reserva ni se descuenta (AC-8). Un producto `draft`, `archived` o
        inexistente devuelve el MISMO 404 (AC-10). Superar `CART_MAX_ITEMS` líneas
        → 409 `dsm:cart/too-many-items` con `max_items`.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: 'Identificador público del producto (US-002/US-003 no exponen id).'
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        - $ref: '#/components/parameters/CartCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCartItemRequest' }
      responses:
        '200':
          description: Carrito completo recalculado
          headers:
            Set-Cookie: { $ref: '#/components/headers/CartCookies' }
            Cache-Control:
              schema: { type: string }
              description: 'Siempre no-store.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CartEnvelope' } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/CartRateLimited' }
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Quita una línea del carrito (AC-3)
      description: >-
        Ruta PÚBLICA SIN auth. Idempotente: quitar algo que no está devuelve el
        carrito igual con 200 y sin error. El producto se resuelve SIN filtrar por
        estado, para que una línea despublicada (AC-6) se pueda sacar. No crea
        carrito: sin cookie devuelve el vacío.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        - $ref: '#/components/parameters/CartCsrfToken'
      responses:
        '200':
          description: Carrito recalculado (vacío si no había carrito)
          headers:
            Set-Cookie: { $ref: '#/components/headers/CartCookies' }
            Cache-Control:
              schema: { type: string }
              description: 'Siempre no-store.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CartEnvelope' } } }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/CartRateLimited' }
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT con claim role=admin (seam ADR-0009)
    sessionCookie:
      type: apiKey
      in: cookie
      name: dsm_access
      description: >-
        Access token de cliente, corto y HttpOnly (US-014). La API NO lo acepta
        por header `Authorization`: aceptarlo permitiría a un XSS usar un token
        robado y anularía la protección de HttpOnly.
  headers:
    SessionCookies:
      description: >-
        Tres cookies (security-standards §7.4): dsm_access (HttpOnly,
        SameSite=Lax, Path=/), dsm_refresh (HttpOnly, SameSite=Lax,
        Path=/v1/auth) y dsm_csrf (SIN HttpOnly — el frontend la lee para armar
        el header X-CSRF-Token). Secure sale de AUTH_COOKIE_SECURE.
      schema: { type: string }
    CartCookies:
      description: >-
        Dos cookies del carrito del invitado (§7.4): dsm_cart (HttpOnly,
        SameSite=Lax, Path=/, Max-Age = CART_TTL_DAYS × 86400) con el token opaco, y
        dsm_cart_csrf (SIN HttpOnly — el frontend la lee para armar X-CSRF-Token),
        que es HMAC(JWT_SECRET, token). Secure sale de AUTH_COOKIE_SECURE. El token
        NUNCA viaja en el cuerpo, y la cookie y la fila `carts.expires_at` vencen
        juntas porque derivan del mismo CART_TTL_DAYS.
      schema: { type: string }
  parameters:
    CartCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >-
        Double-submit firmado del carrito (§7.5): el valor de la cookie
        dsm_cart_csrf. Se exige junto con un Origin de la allowlist, cuya ausencia
        también se rechaza con 403. Es obligatorio CUANDO la petición trae la cookie
        dsm_cart; la primera escritura de un cliente nuevo no la trae y pasa, porque
        todavía no hay carrito que secuestrar.
      schema: { type: string }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: >-
        Double-submit firmado (§7.5): el valor de la cookie dsm_csrf. Se exige
        además de un Origin de la allowlist; la ausencia de Origin se rechaza.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    RateLimited:
      description: >-
        Presupuesto de la superficie de auth excedido (§7.3). Incluye Retry-After
        y las cabeceras RateLimit-* (api-standards §12).
      headers:
        Retry-After: { schema: { type: integer } }
        RateLimit-Limit: { schema: { type: integer } }
        RateLimit-Remaining: { schema: { type: integer } }
        RateLimit-Reset: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CartRateLimited:
      description: >-
        Presupuesto del throttler `cart` excedido (§7.3): CART_RATE_LIMIT_MAX
        lecturas y CART_WRITE_RATE_LIMIT_MAX escrituras por minuto y por IP,
        contadas por endpoint. Incluye Retry-After y las cabeceras RateLimit-*
        (api-standards §12) y `Cache-Control: no-store` — un 429 cacheado en el edge
        convertiría el rate-limit en un DoS.
      headers:
        Retry-After: { schema: { type: integer } }
        RateLimit-Limit: { schema: { type: integer } }
        RateLimit-Remaining: { schema: { type: integer } }
        RateLimit-Reset: { schema: { type: integer } }
        Cache-Control: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem:
      description: Error RFC 7807
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Customer:
      type: object
      description: >-
        Vista pública del cliente: EXACTAMENTE estos cinco campos. Nunca
        password_hash, role, failed_login_attempts, lockout_count, locked_until
        ni deleted_at.
      required: [id, email, name, phone, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        phone: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    CustomerEnvelope:
      type: object
      required: [customer]
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
    RegisterRequest:
      type: object
      required: [email, name, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 120 }
        password:
          type: string
          description: >-
            Mínimo 8 caracteres, máximo 72 BYTES (límite de bcrypt: se rechaza,
            no se trunca) y fuera del corpus de filtradas. Sin reglas de
            composición.
        phone: { type: string, maxLength: 40, nullable: true }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string }
    ResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
    ResetConfirm:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string }
        password: { type: string }
    AdminLogin:
      type: object
      description: >-
        Dos formas admitidas y ninguna más: `{bootstrapToken}` (camino interino de
        US-001) o `{email, password}` (US-014). La validación es condicional sobre
        el mismo objeto para no cambiar la ruta ni la forma de la respuesta.
      properties:
        bootstrapToken: { type: string }
        email: { type: string, format: email }
        password: { type: string }
      oneOf:
        - required: [bootstrapToken]
        - required: [email, password]
    AdminLoginResponse:
      type: object
      required: [token]
      properties:
        token: { type: string, description: JWT con claim role=admin }
    CreateCategory:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        parent_id: { type: string, format: uuid, nullable: true }
    UpdateCategory:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        parent_id: { type: string, format: uuid, nullable: true }
    Category:
      type: object
      required: [id, slug, name, parent_id, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        parent_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    CreateProduct:
      type: object
      required: [sku, name, price_ars_cents, category_id]
      properties:
        sku: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        description_raw: { type: string, nullable: true }
        price_ars_cents: { type: integer, minimum: 1, description: Centavos ARS (IVA incluido) }
        stock: { type: integer, minimum: 0, default: 0 }
        category_id: { type: string, format: uuid }
        image_url: { type: string, nullable: true }
    UpdateProduct:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description_raw: { type: string, nullable: true }
        price_ars_cents: { type: integer, minimum: 1 }
        stock: { type: integer, minimum: 0 }
        category_id: { type: string, format: uuid }
        image_url: { type: string, nullable: true }
        status: { type: string, enum: [draft, published, archived] }
    Product:
      type: object
      required:
        [
          id,
          sku,
          slug,
          name,
          description_raw,
          price_ars_cents,
          stock,
          status,
          category_id,
          image_url,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        slug:
          type: string
          description: 'URL amigable de la ficha pública; el panel la usa para invalidar la caché del storefront tras mutar (product:{slug}).'
        name: { type: string }
        description_raw: { type: string, nullable: true }
        price_ars_cents: { type: integer }
        stock: { type: integer }
        status: { type: string, enum: [draft, published, archived] }
        category_id: { type: string, format: uuid }
        image_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    CategoryTreeNode:
      type: object
      description: 'Rubro con sus subrubros; sin `parent` (la jerarquía la da el anidamiento).'
      required: [slug, name, children]
      properties:
        slug: { type: string }
        name: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryRef' }
    CategoryTree:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CategoryTreeNode' }
    StorefrontCategory:
      type: object
      description: 'Categoría pública (US-002): sin id, parent_id ni timestamps.'
      required: [slug, name, parent, children]
      properties:
        slug: { type: string }
        name: { type: string }
        parent:
          type: object
          nullable: true
          description: 'Rubro padre para el breadcrumb; null si ya es raíz.'
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryRef' }
    StorefrontProductListItem:
      type: object
      description: 'Item de grilla (US-002): sin id, stock numérico, status ni timestamps.'
      required: [slug, name, price_ars_cents, currency, image_url, in_stock]
      properties:
        slug:
          type: string
          description: 'Enlaza a la ficha `/v1/products/{slug}`.'
        name: { type: string }
        price_ars_cents: { type: integer }
        currency: { type: string, enum: [ARS] }
        image_url: { type: string, nullable: true }
        in_stock: { type: boolean }
    StorefrontProductPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StorefrontProductListItem' }
        pagination:
          type: object
          required: [limit, offset, total]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total:
              type: integer
              description: 'Publicados que matchean el filtro, no los de la página.'
    StorefrontProduct:
      type: object
      description: 'Ficha pública (US-003): sólo campos SEO; sin id/stock/status/timestamps.'
      required: [slug, sku, name, description, price_ars_cents, currency, image_url, in_stock, category]
      properties:
        slug:
          type: string
          description: 'URL amigable canónica de la ficha (AC-1).'
        sku:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
          description: 'description_raw; US-005 antepondrá la enriquecida.'
        price_ars_cents:
          type: integer
          description: 'Centavos ARS, IVA incluido (AC-9).'
        currency:
          type: string
          enum: [ARS]
        image_url:
          type: string
          nullable: true
        in_stock:
          type: boolean
          description: 'Derivado de stock mayor a 0 (AC-3/AC-4); sin exponer el nivel.'
        category:
          type: object
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
    ProductList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        pagination:
          type: object
          required: [limit, offset, total]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total: { type: integer }
    SetCartItemRequest:
      type: object
      description: >-
        Entrada de PUT /cart/items/{slug} — UN SOLO campo a propósito. No hay
        unit_price_ars_cents, product_id ni cart_id: todo importe se deriva
        server-side del precio vigente y el carrito se identifica por la cookie.
        Con forbidNonWhitelisted, mandar un campo desconocido es 422 (no se ignora).
      required: [quantity]
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: >-
            Cantidad ABSOLUTA de unidades del producto en el carrito. El tope es
            CART_MAX_QTY_PER_LINE (99 por defecto, cota anti-DoS §7.3). No se acepta
            0: cantidad 0 no es una línea, es un DELETE.
    CartItem:
      type: object
      description: >-
        Línea del carrito (US-007). Sin product_id, cart_id, status ni stock crudo:
        el identificador público es el slug y el inventario se comunica como
        availability + max_quantity (OQ-BE-2).
      required:
        - slug
        - name
        - image_url
        - quantity
        - unit_price_ars_cents
        - currency
        - subtotal_ars_cents
        - availability
        - max_quantity
        - price_changed
      properties:
        slug: { type: string }
        name: { type: string }
        image_url:
          type: string
          nullable: true
        quantity: { type: integer, minimum: 1 }
        unit_price_ars_cents:
          type: integer
          description: 'Precio VIGENTE en centavos ARS (AC-9), no la instantánea guardada.'
        currency: { type: string, enum: [ARS] }
        subtotal_ars_cents:
          type: integer
          description: >-
            unit_price_ars_cents × quantity. Se calcula también en las líneas
            bloqueadas, aunque no entren en el total.
        availability:
          type: string
          enum: [available, insufficient_stock, unavailable]
          description: >-
            available: publicado con stock ≥ cantidad. insufficient_stock: publicado
            con stock < cantidad (AC-6). unavailable: draft o archived (AC-6). La
            línea nunca se borra sola.
        available_quantity:
          type: integer
          description: 'Presente sólo cuando la línea pide más de lo que hay (OQ-BE-2).'
        max_quantity:
          type: integer
          description: 'min(stock, CART_MAX_QTY_PER_LINE) — techo del stepper.'
        price_changed:
          type: boolean
          description: >-
            true si el precio vigente difiere de la instantánea del último toque: el
            cambio se muestra, no se aplica en silencio.
        previous_unit_price_ars_cents:
          type: integer
          description: 'Presente sólo si price_changed es true.'
    Cart:
      type: object
      required:
        - id
        - items
        - item_count
        - total_quantity
        - total_ars_cents
        - has_blocking_issues
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: >-
            null cuando todavía no hay carrito (AC-7). Conocerlo NO da acceso: el
            acceso es la cookie dsm_cart, y no hay ninguna ruta que acepte un id de
            carrito.
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        item_count: { type: integer, description: 'Líneas distintas (no unidades).' }
        total_quantity: { type: integer, description: 'Unidades, incluidas las bloqueadas.' }
        total_ars_cents:
          type: integer
          description: >-
            Suma de los subtotales de las líneas `available` SOLAMENTE (OQ-BE-4): un
            total que incluyera lo no comprable es un número que el checkout va a
            desmentir.
        has_blocking_issues:
          type: boolean
          description: >-
            true si alguna línea no es available. Es la señal con la que US-008
            impide avanzar al pago.
        updated_at:
          type: string
          format: date-time
          nullable: true
    CartEnvelope:
      type: object
      required: [cart]
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
    Problem:
      type: object
      description: RFC 7807
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string, example: 'dsm:catalog/conflict' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        available_quantity:
          type: integer
          description: >-
            Extension member RFC 7807 §3.2 de `dsm:cart/insufficient-stock`
            (US-007 AC-5): unidades realmente disponibles. Va como campo de primer
            nivel para que el frontend no tenga que sacarlo del detail con una regex.
        max_items:
          type: integer
          description: >-
            Extension member de `dsm:cart/too-many-items`: tope de líneas distintas
            por carrito (CART_MAX_ITEMS).
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
