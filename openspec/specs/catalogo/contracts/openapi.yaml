openapi: 3.0.3
info:
  title: DSM — Contrato vivo de la capacidad Catálogo (CAP-1)
  version: 1.0.0
  description: Contrato VIVO de la capacidad, acumulado por /archive-change. Superficie de administración
    entregada por US-001, más la ficha pública de producto de US-003 y la importación
    masiva de inventario de US-006. Las rutas de navegación por categorías se suman al
    archivar US-002.
  contact:
    name: DSM
    url: https://example.com
servers:
- url: /v1
  description: Base URL versionada
tags:
- name: admin-auth
  description: Seam de login admin (AC-8, ADR-0009)
- name: admin-categories
  description: Gestión de categorías (AC-1)
- name: admin-products
  description: Gestión de productos (AC-2..AC-9)
- name: storefront-products
  description: Superficie pública de lectura del storefront (ficha de producto, US-003)
- name: admin-imports
  description: Importación masiva del catálogo por CSV/Excel (US-006). Sólo admin.
- name: health
  description: Liveness / readiness
security:
- adminBearer: []
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT con claim role=admin (seam ADR-0009)
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    RateLimited:
      description: |
        Rate-limit por IP excedido (security-standards §7.3). Trae `Retry-After` y
        las cabeceras `RateLimit-*` (api-standards §12).
      headers:
        Retry-After:
          description: Segundos hasta poder reintentar.
          schema: { type: integer }
        RateLimit-Limit:
          schema: { type: integer }
        RateLimit-Remaining:
          schema: { type: integer }
        RateLimit-Reset:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem:
      description: Error RFC 7807
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    StorefrontProduct:
      type: object
      description: |
        Vista PÚBLICA del producto (US-003). Deliberadamente distinta de `Product`
        (la vista admin): expone `in_stock` como booleano y **no** el nivel de
        stock — publicar cuántas unidades quedan le da a la competencia una
        lectura de la rotación del negocio.
      required:
      - slug
      - sku
      - name
      - description
      - price_ars_cents
      - currency
      - image_url
      - in_stock
      - category
      properties:
        slug:
          type: string
          description: URL amigable canónica de la ficha (AC-1, decisión D-1).
        sku:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
          description: Descripción base (`description_raw`); US-005 antepondrá la enriquecida.
        price_ars_cents:
          type: integer
          description: Precio en centavos de ARS, IVA incluido (AC-9).
        currency:
          type: string
          enum:
          - ARS
        image_url:
          type: string
          nullable: true
          description: 'null → el frontend muestra un placeholder (AC-6).'
        in_stock:
          type: boolean
          description: '`stock > 0` (AC-3/AC-4). Booleano, sin exponer el nivel.'
        category:
          type: object
          required:
          - name
          - slug
          properties:
            name:
              type: string
            slug:
              type: string
    AdminLogin:
      type: object
      required:
      - bootstrapToken
      properties:
        bootstrapToken:
          type: string
          minLength: 1
    AdminLoginResponse:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          description: JWT con claim role=admin
    CreateCategory:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        parent_id:
          type: string
          format: uuid
          nullable: true
    UpdateCategory:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        parent_id:
          type: string
          format: uuid
          nullable: true
    Category:
      type: object
      required:
      - id
      - slug
      - name
      - parent_id
      - created_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    CreateProduct:
      type: object
      required:
      - sku
      - name
      - price_ars_cents
      - category_id
      properties:
        sku:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description_raw:
          type: string
          nullable: true
        price_ars_cents:
          type: integer
          minimum: 1
          description: Centavos ARS (IVA incluido)
        stock:
          type: integer
          minimum: 0
          default: 0
        category_id:
          type: string
          format: uuid
        image_url:
          type: string
          nullable: true
    UpdateProduct:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description_raw:
          type: string
          nullable: true
        price_ars_cents:
          type: integer
          minimum: 1
        stock:
          type: integer
          minimum: 0
        category_id:
          type: string
          format: uuid
        image_url:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - draft
          - published
          - archived
    Product:
      type: object
      required:
      - id
      - sku
      - name
      - description_raw
      - price_ars_cents
      - stock
      - status
      - category_id
      - image_url
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        description_raw:
          type: string
          nullable: true
        price_ars_cents:
          type: integer
        stock:
          type: integer
        status:
          type: string
          enum:
          - draft
          - published
          - archived
        category_id:
          type: string
          format: uuid
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductList:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          type: object
          required:
          - limit
          - offset
          - total
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
    ImportCreated:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          description: Al crear es `pending`; en una réplica del reintento puede ser cualquiera.
    ImportJob:
      type: object
      description: |
        Exactamente estos campos. Nunca `idempotency_key` (credencial de reintento
        del cliente) ni `heartbeat_at` (plumbing del reaper) ni `created_by_subject`.
      required:
      - id
      - status
      - filename
      - source_format
      - total_rows
      - processed_rows
      - created_count
      - updated_count
      - failed_count
      - categories_created_count
      - error_code
      - error_message
      - report_truncated
      - started_at
      - finished_at
      - created_at
      - errors
      - pagination
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
        filename:
          type: string
          description: Nombre original, sólo metadata — nunca se usó como ruta.
        source_format:
          type: string
          enum:
          - csv
          - xlsx
        total_rows:
          type: integer
          nullable: true
          description: '`null` hasta que termina la lectura del archivo.'
        processed_rows:
          type: integer
        created_count:
          type: integer
        updated_count:
          type: integer
        failed_count:
          type: integer
          description: Total real de filas rechazadas, aun con el reporte recortado.
        categories_created_count:
          type: integer
        error_code:
          type: string
          nullable: true
          description: |
            Fallo global del trabajo (`interrupted`, `missing-columns`,
            `row-limit-exceeded`, `unsupported-format`, `invalid-encoding`,
            `internal`); `null` si los fallos fueron por fila.
        error_message:
          type: string
          nullable: true
        report_truncated:
          type: boolean
          description: '`true` si se dejaron de persistir filas al llegar a 1.000 (`IMPORT_MAX_REPORT_ROWS`).'
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportRowError'
        pagination:
          type: object
          required:
          - limit
          - offset
          - total
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
              description: Filas rechazadas persistidas (≤ `failed_count`).
    ImportRowError:
      type: object
      required:
      - row_number
      - sku
      - field
      - error_code
      - error_message
      properties:
        row_number:
          type: integer
          description: 1-based sobre las filas de datos (el encabezado no cuenta).
        sku:
          type: string
          nullable: true
        field:
          type: string
          nullable: true
        error_code:
          type: string
          description: |
            Catálogo cerrado por fila: `missing_required`, `invalid_sku`,
            `invalid_text`, `invalid_price`, `invalid_stock`, `invalid_category`,
            `invalid_image_url`, `duplicate_sku_in_file`, `slug_conflict`,
            `write_failed`.
        error_message:
          type: string
          description: Motivo en el idioma del dueño. Nunca nombra tablas ni columnas.
    Problem:
      type: object
      description: RFC 7807
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          example: dsm:catalog/conflict
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
paths:
  /admin/auth/login:
    $ref: ./openapi/paths/admin-auth-login.yaml
  /admin/categories:
    $ref: ./openapi/paths/admin-categories.yaml
  /admin/categories/{id}:
    $ref: ./openapi/paths/admin-categories-id.yaml
  /admin/products:
    $ref: ./openapi/paths/admin-products.yaml
  /admin/products/{id}:
    $ref: ./openapi/paths/admin-products-id.yaml
  /products/{slug}:
    $ref: ./openapi/paths/storefront-products-slug.yaml
  /admin/imports:
    $ref: ./openapi/paths/admin-imports.yaml
  /admin/imports/{id}:
    $ref: ./openapi/paths/admin-imports-id.yaml
  /admin/imports/{id}/report:
    $ref: ./openapi/paths/admin-imports-id-report.yaml
