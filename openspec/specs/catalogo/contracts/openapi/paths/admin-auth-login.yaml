post:
  tags:
  - admin-auth
  summary: Login admin — intercambia el bootstrap token por un JWT (AC-8)
  description: 'Costura HTTP del seam de auth admin (ADR-0009). Única ruta bajo `/v1/admin/*` SIN `adminBearer`:
    es la que emite el token, exigirlo sería circular. US-014 la reemplaza preservando el contrato `role=admin`.'
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/AdminLogin'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminLoginResponse'
    '401':
      $ref: '#/components/responses/Problem'
    '422':
      $ref: '#/components/responses/Problem'
    '429':
      description: Rate limit de la superficie de auth excedido (security-standards §7.3). Incluye `Retry-After`
        y las cabeceras `RateLimit-*` (api-standards §12).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos hasta reintentar
        RateLimit-Limit:
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '503':
      $ref: '#/components/responses/Problem'
