post:
  tags:
  - admin-products
  summary: Crear producto en draft (AC-2, AC-5, AC-9)
  description: Alta en estado draft; SKU único; validación por campo (422).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateProduct'
  responses:
    '201':
      description: Creado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Product'
    '401':
      $ref: '#/components/responses/Problem'
    '403':
      $ref: '#/components/responses/Problem'
    '409':
      $ref: '#/components/responses/Problem'
    '422':
      $ref: '#/components/responses/Problem'
get:
  tags:
  - admin-products
  summary: Listar productos (paginado, NFR)
  description: Listado paginado del panel (limit/offset).
  parameters:
  - name: limit
    in: query
    schema:
      type: integer
      minimum: 1
      default: 20
  - name: offset
    in: query
    schema:
      type: integer
      minimum: 0
      default: 0
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductList'
    '401':
      $ref: '#/components/responses/Problem'
    '403':
      $ref: '#/components/responses/Problem'
