get:
  tags:
  - admin-products
  summary: Obtener producto (AC-3)
  description: Devuelve un producto por id.
  parameters:
  - $ref: '#/components/parameters/Id'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Product'
    '401':
      $ref: '#/components/responses/Problem'
    '403':
      $ref: '#/components/responses/Problem'
    '404':
      $ref: '#/components/responses/Problem'
patch:
  tags:
  - admin-products
  summary: Editar o cambiar estado (AC-3, AC-4, AC-6, AC-7)
  description: 'Sin `status`: edita campos (AC-3). Con `status`: transición de estado (publicar/archivar/despublicar);
    publicar incompleto → 422 y permanece draft.'
  parameters:
  - $ref: '#/components/parameters/Id'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/UpdateProduct'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Product'
    '401':
      $ref: '#/components/responses/Problem'
    '403':
      $ref: '#/components/responses/Problem'
    '404':
      $ref: '#/components/responses/Problem'
    '409':
      $ref: '#/components/responses/Problem'
    '422':
      $ref: '#/components/responses/Problem'
