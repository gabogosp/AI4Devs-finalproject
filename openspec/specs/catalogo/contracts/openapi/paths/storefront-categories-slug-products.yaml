get:
  operationId: storefrontListCategoryProducts
  tags: [storefront-categories]
  summary: Listado paginado de productos publicados de una categoría (US-002 AC-3)
  description: |
    Ruta PÚBLICA SIN auth. Sólo `published` (AC-8: draft/archived nunca
    aparecen, ni en `data` ni en `total`). Un RUBRO agrega los productos de
    sus subrubros directos; un SUBRUBRO lista sólo los propios (decisión
    D1). Paginación offset con `total` (D3), `limit` 1..100 default 20 — el
    catálogo completo nunca se transfiere de una (AC-7). Orden estable
    `name ASC, id ASC`. Categoría existente sin publicados → 200 con
    `data` vacía (AC-6); categoría inexistente → 404 (AC-9).
  security: []
  parameters:
    - name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
    - name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    - name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    '200':
      description: Página de productos publicados (puede ser vacía)
      headers:
        Cache-Control:
          schema: { type: string }
          description: 'public, max-age=60, stale-while-revalidate=30'
      content:
        application/json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/StorefrontProductPage' }
    '404':
      $ref: '../../openapi.yaml#/components/responses/Problem'
    '422':
      $ref: '../../openapi.yaml#/components/responses/Problem'
    '429':
      $ref: '../../openapi.yaml#/components/responses/RateLimited'
