post:
  tags:
  - admin-categories
  summary: Crear categoría (AC-1)
  description: Crea una categoría; el slug se deriva del nombre (único).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/CreateCategory'
  responses:
    '201':
      description: Creada
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Category'
    '401':
      $ref: '../../openapi.yaml#/components/responses/Problem'
    '403':
      $ref: '../../openapi.yaml#/components/responses/Problem'
    '409':
      $ref: '../../openapi.yaml#/components/responses/Problem'
    '422':
      $ref: '../../openapi.yaml#/components/responses/Problem'
get:
  tags:
  - admin-categories
  summary: Listar categorías (AC-1)
  description: Devuelve todas las categorías.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../openapi.yaml#/components/schemas/Category'
    '401':
      $ref: '../../openapi.yaml#/components/responses/Problem'
    '403':
      $ref: '../../openapi.yaml#/components/responses/Problem'
