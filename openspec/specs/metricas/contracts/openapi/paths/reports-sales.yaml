get:
  operationId: getAdminReportsSales
  tags: [admin-reports]
  summary: Evolución de ventas en el tiempo (US-016 AC-1, AC-4, AC-5, AC-9)
  description: >-
    Agrupa por día/semana/mes. Sólo cuentan las 4 órdenes activas (AC-8).
    Sin `created_at_from`/`created_at_to`, default a los últimos 30 días.
    Un `created_at_from` anterior al piso de retención vigente
    (ORDER_RETENTION_MONTHS, default 12) se acota silenciosamente al piso
    (AC-9) — la respuesta lleva el rango EFECTIVO en `range`. Un rango sin
    órdenes responde 200 con `data: []` (AC-5), nunca error.
  parameters:
    - name: created_at_from
      in: query
      schema: { type: string, format: date-time }
    - name: created_at_to
      in: query
      schema: { type: string, format: date-time }
    - name: granularity
      in: query
      schema: { type: string, enum: [day, week, month], default: day }
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/AdminReportsSales' }
    '401': { $ref: '../../openapi.yaml#/components/responses/Problem' }
    '403': { $ref: '../../openapi.yaml#/components/responses/Problem' }
    '422':
      description: 'dsm:reports/invalid-range — created_at_from posterior a created_at_to.'
      content:
        application/problem+json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/Problem' }
