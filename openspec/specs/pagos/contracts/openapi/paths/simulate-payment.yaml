post:
  operationId: simulatePayment
  tags: [checkout]
  summary: Confirmar un pago simulado "DSM" para una orden pendiente de pago (US-010 AC-9)
  description: |
    Salta MercadoPago por completo: marca el pago `approved` directo y dispara el mismo
    camino de confirmación + decremento de stock + notificación que el webhook real —
    lo que vuelve AC-9 estructural (un solo `ConfirmOrderService.confirm()`, no dos
    caminos). Autorizado por el `order_token` de la orden (mismo contrato que
    `POST /v1/payments`, US-009), no por JWT. Gateado por `PAYMENTS_SIMULATED_ENABLED`
    — el arranque de la app falla si este flag está en `true` con `NODE_ENV=production`
    (ADR-0006, enforced en código). Responde 404 cuando el flag está apagado, para no
    revelar la existencia del endpoint en producción.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../openapi.yaml#/components/schemas/SimulatePaymentRequest' }
        examples:
          minimal:
            value: { order_token: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2" }
  responses:
    '200':
      description: |
        Pago simulado confirmado — orden `new`, stock decrementado. Mismo
        `PaymentConfirmed` que `POST /admin/orders/{orderId}/confirm-payment` (US-023).
      content:
        application/json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/PaymentConfirmed' }
    '404':
      description: Flag `PAYMENTS_SIMULATED_ENABLED` apagado, o `order_token` no encontrado.
      content:
        application/problem+json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/Problem' }
    '409':
      $ref: '../../openapi.yaml#/components/responses/AutoCancelledInsufficientStock'
    '422':
      description: "`order_token` con formato inválido (no hex de 64)."
      content:
        application/problem+json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/Problem' }
    '429':
      description: Rate limit de la superficie de simulación excedido.
      content:
        application/problem+json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/Problem' }
