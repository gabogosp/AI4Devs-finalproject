post:
  tags: [customer-auth]
  operationId: registerCustomer
  summary: Alta de cliente con sesión activa inmediata (AC-1)
  description: |
    Sin verificación de email intermedia: la cuenta queda usable en el acto.
    Un email ya registrado devuelve 409 con un mensaje que NO confirma que la
    dirección exista (AC-6). Enviar `role`, `id` o `password_hash` devuelve
    422: no se ignoran.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../openapi.yaml#/components/schemas/RegisterRequest' }
  responses:
    '201':
      description: Cliente creado y sesión abierta.
      headers:
        Set-Cookie: { $ref: '../../openapi.yaml#/components/headers/SessionCookies' }
      content:
        application/json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/CustomerEnvelope' }
    '409':
      description: '`dsm:auth/registration-failed` — email ya registrado (mensaje genérico, AC-6).'
      content:
        application/problem+json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/Problem' }
    '422':
      description: Datos inválidos, contraseña fuera de política, o campo no permitido (`role`/`id`/`password_hash`).
      content:
        application/problem+json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/Problem' }
    '429':
      $ref: '../../openapi.yaml#/components/responses/RateLimited'
