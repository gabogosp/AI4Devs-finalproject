post:
  tags: [customer-auth]
  operationId: confirmPasswordReset
  summary: Fija la contraseña nueva con el token del email (AC-4, AC-7)
  description: |
    Completar el reset revoca TODAS las sesiones de la cuenta (§3.7), borra
    los demás tokens pendientes y levanta el bloqueo por intentos fallidos.
    NO emite sesión: devolver una dejaría viva justo la del que completó el
    flujo, y puede haberlo completado el atacante. Token inexistente,
    vencido o ya usado devuelven el mismo 400.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../openapi.yaml#/components/schemas/ResetConfirm' }
  responses:
    '200':
      description: 'Contraseña cambiada. Sin Set-Cookie: no se abre sesión.'
    '400':
      description: '`dsm:auth/invalid-reset-token` — token inexistente, vencido o ya usado (mismo 400 en los tres casos).'
      content:
        application/problem+json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/Problem' }
    '422':
      description: |
        La contraseña nueva viola la política. NO consume el token: un
        error de tipeo no debe obligar a pedir otro email.
      content:
        application/problem+json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/Problem' }
    '429':
      $ref: '../../openapi.yaml#/components/responses/RateLimited'
