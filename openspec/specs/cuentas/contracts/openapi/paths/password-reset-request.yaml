post:
  tags: [customer-auth]
  operationId: requestPasswordReset
  summary: Solicita el enlace de recuperación (AC-11)
  description: |
    SIEMPRE 202, con cuerpo y cabeceras idénticos exista o no la cuenta —
    incluido el Content-Length. Tampoco cambia si se superó el límite por
    cuenta ni si el proveedor de email falla: cualquier diferencia
    observable convertiría la ruta en un verificador de direcciones
    registradas. El envío real es vía Resend (adelantado desde US-011,
    decisión del PO 2026-08-19).
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../openapi.yaml#/components/schemas/ResetRequest' }
  responses:
    '202':
      description: Pedido aceptado. No informa si se envió algo.
    '422':
      description: Email inválido.
      content:
        application/problem+json:
          schema: { $ref: '../../openapi.yaml#/components/schemas/Problem' }
    '429':
      $ref: '../../openapi.yaml#/components/responses/RateLimited'
