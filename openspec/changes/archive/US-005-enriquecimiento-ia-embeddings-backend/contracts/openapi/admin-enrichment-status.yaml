openapi: 3.1.0
info:
  title: DSM Ferretería — GET /admin/enrichment/status
  version: 1.0.0-draft
  contact:
    name: DSM
    url: https://example.com
  description: |
    Contrato draft de US-005 (enriquecimiento IA + embeddings). Al archivar el change, los dos
    endpoints extienden la capacidad **existente** `openspec/specs/catalogo/`: el enriquecimiento
    es catálogo, no una capacidad nueva.

    Este endpoint responde una sola pregunta, y es la que decide si la tienda puede vender por
    búsqueda: **¿cuántos productos del catálogo son buscables?** (AC-3). Sin él, un catálogo con
    3 de 800 productos vectorizados se ve idéntico a uno completo hasta que un cliente busca y no
    encuentra nada.

    Es una superficie de **diagnóstico**, así que lo que **no** devuelve es tan deliberado como
    lo que devuelve: ni la clave del proveedor, ni la URL de su API, ni un mensaje crudo de
    error. `last_error_code` es un `type` del catálogo `dsm:enrichment/*` — información útil sin
    secretos adentro (AC-9).
servers:
  - url: /v1
tags:
  - name: admin-enrichment
    description: Enriquecimiento IA y embeddings del catálogo (US-005). Sólo admin.
paths:
  /admin/enrichment/status:
    get:
      operationId: getEnrichmentStatus
      tags: [admin-enrichment]
      summary: Cobertura de embeddings y estado del ejecutor (AC-3)
      description: |
        Devuelve la cobertura del catálogo, el estado del ejecutor in-process (ADR-0014) y los
        modelos con los que se generó el texto y los vectores.

        **No consume el presupuesto del `POST`**: el panel lo consulta en loop mientras una
        corrida avanza, y si mirar el progreso gastara el cupo de disparo, el dueño se quedaría
        sin poder lanzar una corrida por haber mirado la barra.

        `runner_state` distingue cuatro situaciones que se resuelven distinto:
        - `idle` — listo para arrancar.
        - `running` — hay una corrida en curso; un `POST` devolvería 409.
        - `cooldown` — el breaker está abierto tras fallos consecutivos del proveedor. Es el
          diagnóstico de "Gemini caído / rate-limited" del runbook.
        - `disabled` — no hay proveedor configurado (`GEMINI_API_KEY` ausente) o
          `ENRICHMENT_ENABLED=false`. El catálogo queda navegable por categoría (AC-5) pero **no
          se generan vectores**, así que la búsqueda semántica no tendría qué consultar.

        **El caso sin clave**, que no va como `example` porque Spectral no procesa un `null`
        literal dentro de un ejemplo (limitación de la herramienta, no del contrato — la
        nullabilidad está declarada en el esquema):

        ```json
        {
          "runner_state": "disabled",
          "coverage": { "total": 812, "enriched": 0, "embedded": 0,
                        "pending": 812, "abandoned": 0, "coverage_ratio": 0 },
          "models": { "enrich": "gemini-1.5-flash", "embed": "text-embedding-004" },
          "last_error_code": null,
          "last_run_at": null
        }
        ```

        `last_error_code` y `last_run_at` son `null` mientras no haya corrido ninguna corrida en
        este proceso: el estado del ejecutor es en memoria (ADR-0014) y lo durable es
        `products.enrichment_done`. Un reinicio los vuelve a `null` sin perder trabajo.
      security:
        - adminBearer: []
      responses:
        '200':
          description: Cobertura y estado actuales.
          headers:
            Cache-Control:
              description: |
                `no-store`: el estado de un ejecutor no se cachea. Un valor viejo acá haría
                creer que una corrida sigue viva cuando ya terminó.
              schema: { type: string, examples: ['no-store'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichmentStatus' }
              examples:
                catalogoCasiCompleto:
                  summary: >
                    Operación normal — cobertura alta y ejecutor libre. `last_error_code`
                    conserva el último transitorio de la corrida (se reintentó y se resolvió):
                    es diagnóstico, no una alarma.
                  value:
                    runner_state: idle
                    coverage:
                      total: 812
                      enriched: 806
                      embedded: 799
                      pending: 6
                      abandoned: 0
                      coverage_ratio: 0.9840
                    models:
                      enrich: gemini-1.5-flash
                      embed: text-embedding-004
                    last_error_code: 'dsm:enrichment/ai-transient'
                    last_run_at: '2026-08-23T03:14:22.481Z'
                proveedorCaido:
                  summary: Breaker abierto tras fallos consecutivos del proveedor
                  value:
                    runner_state: cooldown
                    coverage:
                      total: 812
                      enriched: 340
                      embedded: 331
                      pending: 460
                      abandoned: 12
                      coverage_ratio: 0.4077
                    models:
                      enrich: gemini-1.5-flash
                      embed: text-embedding-004
                    last_error_code: 'dsm:enrichment/ai-transient'
                    last_run_at: '2026-08-23T04:02:10.115Z'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT con `role=admin` (ADR-0009). Sin él, 401; con otro rol, 403.
  responses:
    Problem:
      description: Error en envelope RFC 7807.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    EnrichmentStatus:
      type: object
      required: [runner_state, coverage, models, last_error_code, last_run_at]
      additionalProperties: false
      properties:
        runner_state:
          type: string
          enum: [idle, running, cooldown, disabled]
        coverage:
          $ref: '#/components/schemas/Coverage'
        models:
          type: object
          required: [enrich, embed]
          additionalProperties: false
          description: |
            Los **nombres** de los modelos, nunca la clave. El panel los necesita para
            interpretar la cobertura tras un cambio de modelo: los vectores viejos siguen
            existiendo con su `model_version` y hay que regenerarlos (AC-8).
          properties:
            enrich: { type: string, examples: ['gemini-1.5-flash'] }
            embed: { type: string, examples: ['text-embedding-004'] }
        last_error_code:
          type: [string, 'null']
          description: |
            Último `type` del catálogo `dsm:enrichment/*`, **no** el mensaje del proveedor: un
            mensaje crudo puede traer la URL con la clave o el texto del producto (AC-9).
          examples: ['dsm:enrichment/ai-transient']
        last_run_at:
          type: [string, 'null']
          format: date-time
          description: |
            Fin de la última corrida **de este proceso**. `null` si no corrió ninguna desde el
            arranque: el estado del ejecutor es en memoria (ADR-0014), lo durable es
            `products.enrichment_done`.
    Coverage:
      type: object
      required: [total, enriched, embedded, pending, abandoned, coverage_ratio]
      additionalProperties: false
      description: |
        `pending + abandoned + hechos = total`. Se separan porque se resuelven distinto:
        `pending` se resuelve esperando la próxima corrida, `abandoned` **no se resuelve solo**
        y necesita un `POST /runs` con `force: true`.
      properties:
        total:
          type: integer
          description: Productos del catálogo, en cualquier estado.
        enriched:
          type: integer
          description: Con `description_enriched` escrita (por la IA o curada por el dueño).
        embedded:
          type: integer
          description: Con fila en `product_embeddings`. **Éste** es el que decide si la búsqueda funciona.
        pending:
          type: integer
          description: Elegibles para la próxima corrida (`enrichment_done = false` y con intentos disponibles).
        abandoned:
          type: integer
          description: Agotaron `ENRICHMENT_MAX_ATTEMPTS`. Siguen visibles en la tienda (AC-5).
        coverage_ratio:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            `embedded / total`, o `0` con catálogo vacío. El KPI de AC-3 (≥ 0,9) se mide acá,
            sobre el catálogo real y después de una corrida — no es una propiedad del código.
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          description: |
            `dsm:catalog/http-401` y `dsm:catalog/http-403` de la frontera admin.
          examples: ['dsm:catalog/http-401']
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
