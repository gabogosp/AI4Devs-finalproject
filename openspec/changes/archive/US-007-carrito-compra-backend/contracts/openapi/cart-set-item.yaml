openapi: 3.1.0
info:
  title: DSM Ferretería — PUT /cart/items/{slug}
  version: 1.0.0-draft
  contact:
    name: DSM
    url: https://example.com
  description: |
    Contrato draft de US-007 (carrito de compra del invitado). Al archivar el
    change, estos 3 endpoints forman la capacidad nueva `openspec/specs/carrito/`.

    **Semántica absoluta**: el cuerpo fija la cantidad, no la suma. Por eso la
    operación es **naturalmente idempotente** (api-standards §10.5) y no necesita
    `Idempotency-Key` ni su almacén (OQ-BE-5): un reintento de red nunca compra de
    más. El precio a pagar es que un doble clic en «Agregar» con el mismo payload
    deja 1 unidad, no 2 — el FE siempre tiene la cantidad actual porque **las tres
    respuestas devuelven el carrito completo**.

    **El carrito no reserva ni descuenta stock** (AC-8, ADR-0008): lo lee para no
    dejar pedir más de lo que hay y lo suelta. El inventario se decrementa sólo al
    aprobarse el pago (US-010).
servers:
  - url: /v1
tags:
  - name: cart
    description: Carrito de compra del invitado (US-007). Superficie pública.
paths:
  /cart/items/{slug}:
    put:
      operationId: setCartItem
      tags: [cart]
      summary: Fija la cantidad de un producto en el carrito (AC-1, AC-2, AC-5, AC-10)
      description: |
        Crea la línea si no existe y actualiza la cantidad si ya estaba. Crea el
        carrito y emite las cookies cuando todavía no había.

        Orden de validación: producto → stock → carrito. Un rechazo **no escribe
        nada** — ni la línea, ni el carrito, ni la cookie.

        Un producto en `draft`, `archived` o inexistente devuelve **el mismo 404**
        (AC-10): distinguirlos convertiría el carrito en un oráculo de enumeración
        del catálogo oculto.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: |
            Identificador **público** del producto (US-002/US-003 no exponen `id`).
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: false
          description: |
            Double-submit firmado (security-standards §7.5): el valor de la cookie
            `dsm_cart_csrf`, que es `HMAC(JWT_SECRET, token del carrito)`. Se exige
            **además** de un `Origin` de la allowlist, y la ausencia de `Origin` se
            rechaza con 403.

            Es obligatorio **cuando la petición trae la cookie `dsm_cart`**. La
            **primera** escritura de un cliente nuevo no la trae: todavía no hay
            carrito que secuestrar, no hay valor que derivar, y lo peor que
            consigue un tercero es que la víctima estrene un carrito vacío.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCartItemRequest'
            examples:
              dosUnidades:
                value: { quantity: 2 }
      responses:
        '200':
          description: |
            Carrito completo recalculado. Emite (o re-emite) las dos cookies con el
            `Max-Age` derivado de `CART_TTL_DAYS`, deslizando la ventana de
            retención junto con `carts.expires_at`.
          headers:
            Set-Cookie:
              description: |
                Dos cookies (security-standards §7.4): `dsm_cart` (`HttpOnly`,
                `SameSite=Lax`, `Path=/`, `Max-Age = CART_TTL_DAYS × 86400`) con el
                token opaco, y `dsm_cart_csrf` (**sin** `HttpOnly` — el frontend la
                lee para armar el header). `Secure` sale de `AUTH_COOKIE_SECURE`.
                El token **nunca** viaja en el cuerpo.
              schema: { type: string }
            Cache-Control:
              description: Siempre `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartEnvelope'
        '403':
          description: |
            `dsm:auth/csrf` — falta el double-submit, no coincide con el token
            presentado, o el `Origin` no está en la allowlist (incluida su ausencia,
            fail closed).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |
            `dsm:catalog/not-found` — slug inexistente **o** producto no publicado
            (AC-10). Las dos respuestas son idénticas salvo `instance`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            `dsm:cart/insufficient-stock` (AC-5) con la extensión
            `available_quantity`, o `dsm:cart/too-many-items` con `max_items`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                stockInsuficiente:
                  value:
                    type: dsm:cart/insufficient-stock
                    title: Conflict
                    status: 409
                    detail: No hay stock suficiente para la cantidad pedida
                    instance: /v1/cart/items/taco-fischer-sx-8mm
                    available_quantity: 3
                demasiadasLineas:
                  value:
                    type: dsm:cart/too-many-items
                    title: Conflict
                    status: 409
                    detail: El carrito alcanzó el máximo de productos distintos
                    instance: /v1/cart/items/mecha-widia-8mm
                    max_items: 50
        '422':
          description: |
            `dsm:catalog/http-422` — `quantity` fuera de rango (entero de 1 a
            `CART_MAX_QTY_PER_LINE`) **o un campo desconocido**: el
            `ValidationPipe` global corre con `forbidNonWhitelisted`, así que mandar
            `unit_price_ars_cents` o `cart_id` es un 422, no un campo ignorado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  responses:
    RateLimited:
      description: |
        Presupuesto de **escritura** del throttler `cart` excedido
        (security-standards §7.3): `CART_WRITE_RATE_LIMIT_MAX` por minuto y por IP,
        más estricto que el de lectura porque cada request crea o modifica filas.
      headers:
        Retry-After:
          description: Segundos hasta poder reintentar.
          schema: { type: integer }
        RateLimit-Limit:
          schema: { type: integer }
        RateLimit-Remaining:
          schema: { type: integer }
        RateLimit-Reset:
          schema: { type: integer }
        Cache-Control:
          description: '`no-store` también acá (un 429 cacheado es un DoS).'
          schema: { type: string }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SetCartItemRequest:
      type: object
      required: [quantity]
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: |
            Cantidad **absoluta** de unidades de este producto en el carrito. El
            máximo es `CART_MAX_QTY_PER_LINE` (99 por defecto, cota anti-DoS §7.3).
            No se acepta 0: cantidad 0 no es una línea, es un `DELETE`.
      description: |
        **Un solo campo, a propósito.** No hay `unit_price_ars_cents`, ni
        `product_id`, ni `cart_id`: todos los importes se derivan server-side del
        precio vigente de `products`, y el carrito se identifica por la cookie.
    CartEnvelope:
      type: object
      required: [cart]
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
    Cart:
      type: object
      required:
        - id
        - items
        - item_count
        - total_quantity
        - total_ars_cents
        - has_blocking_issues
        - updated_at
      properties:
        id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        item_count: { type: integer }
        total_quantity: { type: integer }
        total_ars_cents:
          type: integer
          description: Suma de las líneas `available` solamente (OQ-BE-4).
        has_blocking_issues: { type: boolean }
        updated_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    CartItem:
      type: object
      required:
        - slug
        - name
        - image_url
        - quantity
        - unit_price_ars_cents
        - currency
        - subtotal_ars_cents
        - availability
        - max_quantity
        - price_changed
      properties:
        slug: { type: string }
        name: { type: string }
        image_url:
          oneOf:
            - type: string
            - type: 'null'
        quantity: { type: integer }
        unit_price_ars_cents:
          type: integer
          description: Precio vigente en centavos ARS, no la instantánea.
        currency:
          type: string
          enum: [ARS]
        subtotal_ars_cents: { type: integer }
        availability:
          type: string
          enum: [available, insufficient_stock, unavailable]
        available_quantity:
          type: integer
          description: Presente sólo si la línea pide más de lo que hay (OQ-BE-2).
        max_quantity: { type: integer }
        price_changed: { type: boolean }
        previous_unit_price_ars_cents: { type: integer }
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          description: |
            Catálogo **cerrado**: `dsm:cart/insufficient-stock`,
            `dsm:cart/too-many-items`, `dsm:catalog/not-found`, `dsm:auth/csrf`,
            `dsm:catalog/http-422`, `dsm:catalog/http-429`.
          examples: ['dsm:cart/insufficient-stock']
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: '**Nunca** contiene el token del carrito ni su hash.'
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        available_quantity:
          type: integer
          description: |
            Extension member de RFC 7807 §3.2 en `dsm:cart/insufficient-stock`:
            unidades realmente disponibles. Va como **campo de primer nivel** para
            que el FE no tenga que sacarlo del `detail` con una regex.
        max_items:
          type: integer
          description: |
            Extension member en `dsm:cart/too-many-items`: tope de líneas
            distintas por carrito (`CART_MAX_ITEMS`).
