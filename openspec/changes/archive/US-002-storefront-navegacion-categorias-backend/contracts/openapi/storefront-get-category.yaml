openapi: 3.0.3
info:
  title: "storefront-get-category — Detalle público de una categoría"
  version: "v1"
  description: |
    Endpoint PÚBLICO (sin auth) del detalle de categoría (US-002 AC-1/AC-2/AC-9).
    Trae `parent` para el breadcrumb "volver al rubro" y `children` para los
    subrubros. Un slug inexistente devuelve **404** — nunca un 200 vacío, que
    sería una página fantasma indexable. Es el único endpoint que emite el
    evento de negocio `category.viewed` (decisión D4).
servers:
  - url: https://api.dsm.example.com
    description: PROD (Railway, single-region US-East per ADR-0001)
  - url: http://localhost:3000
    description: LOCAL

tags:
  - name: storefront-categories
    description: Superficie pública de navegación por categorías.

paths:
  /v1/categories/{slug}:
    get:
      operationId: storefrontGetCategory
      tags: [storefront-categories]
      summary: Obtener el detalle de una categoría por su slug
      description: |
        Lectura pública de una categoría con su familia. Emite `category.viewed`
        (insumo del panel de métricas US-016) sólo ante un 200.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: URL amigable de la categoría (kebab-case).
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        - name: traceparent
          in: header
          required: false
          description: Contexto de traza W3C para correlacionar el evento.
          schema: { type: string }
      responses:
        '200':
          description: Categoría con su padre y sus subrubros.
          headers:
            Cache-Control:
              description: Default del storefront (D5).
              schema:
                { type: string, example: "public, max-age=60, stale-while-revalidate=30" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontCategory' }
              example:
                slug: "compresores"
                name: "Compresores"
                parent: { slug: "refrigeracion", name: "Refrigeración" }
                children: []
        '404': { $ref: '#/components/responses/CategoryNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  schemas:
    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    StorefrontCategory:
      type: object
      description: 'Categoría pública: sin id, parent_id ni timestamps.'
      required: [slug, name, parent, children]
      properties:
        slug: { type: string }
        name: { type: string }
        parent:
          type: object
          nullable: true
          description: >-
            Referencia al rubro padre para el breadcrumb; null cuando la
            categoría ya es un rubro raíz. Se declara inline (y no por $ref)
            porque en OAS 3.0 `nullable` no compone con `allOf`.
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryRef' }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
  responses:
    CategoryNotFound:
      description: La categoría no existe (AC-9) — nunca un 200 con contenido vacío.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            { type: "dsm:catalog/not-found", title: "Not Found", status: 404, detail: "Categoría no encontrada" }
    TooManyRequests:
      description: Rate-limit por IP excedido (§7.3). Trae Retry-After y RateLimit-*.
      headers:
        Retry-After:
          description: Segundos hasta poder reintentar.
          schema: { type: integer }
        RateLimit-Limit:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: "dsm:catalog/http-429", title: "Too Many Requests", status: 429 }
