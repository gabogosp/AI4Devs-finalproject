openapi: 3.1.0
info:
  title: DSM Ferretería — POST /auth/password-reset/request
  version: 1.0.0-draft
  contact:
    name: DSM
    url: https://example.com
  description: |
    Contrato draft de US-014 (registro, login y sesión). Al archivar el change,
    estos 7 endpoints forman la capacidad nueva `openspec/specs/cuentas/`.

    **Ningún token de sesión viaja en el cuerpo** (AC-9): el access, el refresh y
    el valor de CSRF se emiten **sólo** como `Set-Cookie`. Un cuerpo con el token
    sería legible por cualquier script inyectado y anularía el `HttpOnly`.
servers:
  - url: /v1
tags:
  - name: customer-auth
    description: Registro, sesión y recuperación de contraseña del cliente (US-014).
paths:
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [customer-auth]
      summary: Solicita el enlace de recuperación (AC-11)
      description: |
        **Siempre 202**, con cuerpo y cabeceras idénticos exista o no la cuenta —
        incluido el `Content-Length`. Tampoco cambia si se superó el límite de
        emisiones por cuenta ni si el proveedor de email falla: cualquier
        diferencia observable convertiría la ruta en un verificador de qué
        direcciones están registradas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: |
            Pedido aceptado. **No** informa si se envió algo: ver la descripción.
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  responses:
    Problem:
      description: Error en envelope RFC 7807.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: |
        Presupuesto de la superficie de auth excedido (security-standards §7.3).
      headers:
        Retry-After:
          description: Segundos hasta poder reintentar.
          schema: { type: integer }
        RateLimit-Limit:
          schema: { type: integer }
        RateLimit-Remaining:
          schema: { type: integer }
        RateLimit-Reset:
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          description: |
            URI del catálogo cerrado `dsm:auth/*`. Los valores posibles en esta
            superficie son exactamente: `dsm:auth/invalid-credentials`,
            `dsm:auth/unauthenticated`, `dsm:auth/invalid-refresh`,
            `dsm:auth/csrf`, `dsm:auth/registration-failed`,
            `dsm:auth/invalid-reset-token` y `dsm:catalog/validation` (422).
          examples: ['dsm:auth/invalid-credentials']
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: |
            **Nunca** contiene el email consultado, la contraseña, el hash ni un
            token. Los mensajes de credenciales inválidas son idénticos para
            contraseña incorrecta, cuenta inexistente y cuenta bloqueada.
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
