openapi: 3.1.0
info:
  title: DSM Ferretería — POST /auth/refresh
  version: 1.0.0-draft
  contact:
    name: DSM
    url: https://example.com
  description: |
    Contrato draft de US-014 (registro, login y sesión). Al archivar el change,
    estos 7 endpoints forman la capacidad nueva `openspec/specs/cuentas/`.

    **Ningún token de sesión viaja en el cuerpo** (AC-9): el access, el refresh y
    el valor de CSRF se emiten **sólo** como `Set-Cookie`. Un cuerpo con el token
    sería legible por cualquier script inyectado y anularía el `HttpOnly`.
servers:
  - url: /v1
tags:
  - name: customer-auth
    description: Registro, sesión y recuperación de contraseña del cliente (US-014).
paths:
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [customer-auth]
      summary: Rota el refresh y renueva la sesión (ADR-0011)
      description: |
        Consume la cookie `dsm_refresh` y emite una nueva de la **misma familia**.
        El refresh es de un solo uso: presentar uno ya rotado se trata como robo y
        **revoca la familia entera**, devolviendo el mismo `401` que un token
        inexistente — distinguirlos le confirmaría al atacante que su réplica llegó.

        No exige un access válido: el access ya venció, que es el motivo por el
        que se llama a esta ruta.
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          description: |
            Double-submit firmado (security-standards §7.5): el valor de la cookie
            `dsm_csrf`. Se exige **además** de un `Origin` de la allowlist; la
            ausencia de `Origin` se rechaza con 403.
          schema: { type: string }
      responses:
        '200':
          description: Sesión renovada.
          headers:
            Set-Cookie:
              description: |
                Tres cookies (security-standards §7.4):
                `dsm_access` (HttpOnly, SameSite=Lax, Path=/, Max-Age = AUTH_ACCESS_TTL_MIN),
                `dsm_refresh` (HttpOnly, SameSite=Lax, **Path=/v1/auth**, Max-Age = AUTH_REFRESH_TTL_DAYS) y
                `dsm_csrf` (**sin** HttpOnly — el frontend la lee para armar el header
                `X-CSRF-Token`). `Secure` sale de `AUTH_COOKIE_SECURE`.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [customer]
                properties:
                  customer: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  responses:
    Problem:
      description: Error en envelope RFC 7807.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: |
        Presupuesto de la superficie de auth excedido (security-standards §7.3).
      headers:
        Retry-After:
          description: Segundos hasta poder reintentar.
          schema: { type: integer }
        RateLimit-Limit:
          schema: { type: integer }
        RateLimit-Remaining:
          schema: { type: integer }
        RateLimit-Reset:
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          description: |
            URI del catálogo cerrado `dsm:auth/*`. Los valores posibles en esta
            superficie son exactamente: `dsm:auth/invalid-credentials`,
            `dsm:auth/unauthenticated`, `dsm:auth/invalid-refresh`,
            `dsm:auth/csrf`, `dsm:auth/registration-failed`,
            `dsm:auth/invalid-reset-token` y `dsm:catalog/validation` (422).
          examples: ['dsm:auth/invalid-credentials']
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: |
            **Nunca** contiene el email consultado, la contraseña, el hash ni un
            token. Los mensajes de credenciales inválidas son idénticos para
            contraseña incorrecta, cuenta inexistente y cuenta bloqueada.
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    Customer:
      type: object
      description: |
        Vista pública del cliente. **Exactamente** estos cinco campos: nunca
        `password_hash`, `role`, `failed_login_attempts`, `lockout_count`,
        `locked_until` ni `deleted_at`.
      required: [id, email, name, phone, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        phone:
          type: [string, 'null']
        created_at: { type: string, format: date-time }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dsm_access
      description: |
        Access token de vida corta. `HttpOnly`, así que ningún script del cliente
        puede leerlo — y por eso la API no lo acepta por header `Authorization`.
