openapi: 3.0.3
info:
  title: "admin-list-categories — Listar categorías"
  version: "v1"
  description: |
    Lista las categorías disponibles para asignar a productos (AC-1).
    Exclusivo del rol admin (AC-8).
servers:
  - url: https://api.dsm.example.com
    description: PROD (Railway, single-region US-East per ADR-0001)
  - url: http://localhost:3000
    description: LOCAL

paths:
  /v1/admin/categories:
    get:
      operationId: adminListCategories
      tags: [categories, admin]
      summary: Listar categorías
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryDTO' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    CategoryDTO:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        parent_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
  responses:
    Unauthorized:
      description: Sin sesión admin (AC-8)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: "dsm:catalog/unauthorized", title: "No autorizado", status: 401 }
    Forbidden:
      description: Sesión sin rol admin (AC-8)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: "dsm:catalog/forbidden", title: "Acceso denegado", status: 403 }
