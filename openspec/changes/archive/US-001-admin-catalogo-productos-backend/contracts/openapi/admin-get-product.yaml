openapi: 3.0.3
info:
  title: "admin-get-product — Obtener un producto"
  version: "v1"
  description: |
    Devuelve un producto por id (para leer antes de editar — AC-3).
    Exclusivo del rol admin (AC-8).
servers:
  - url: https://api.dsm.example.com
    description: PROD (Railway, single-region US-East per ADR-0001)
  - url: http://localhost:3000
    description: LOCAL

paths:
  /v1/admin/products/{id}:
    get:
      operationId: adminGetProduct
      tags: [products, admin]
      summary: Obtener un producto por id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDTO' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ProductDTO:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description_raw: { type: string, nullable: true }
        price_ars_cents: { type: integer }
        stock: { type: integer }
        status: { type: string, enum: [draft, published, archived] }
        category_id: { type: string, format: uuid }
        image_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
  responses:
    Unauthorized:
      description: Sin sesión admin (AC-8)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: "dsm:catalog/unauthorized", title: "No autorizado", status: 401 }
    Forbidden:
      description: Sesión sin rol admin (AC-8)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: "dsm:catalog/forbidden", title: "Acceso denegado", status: 403 }
    ProductNotFound:
      description: Producto inexistente
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { type: "dsm:catalog/product-not-found", title: "Producto no encontrado", status: 404 }
