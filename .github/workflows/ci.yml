name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dsm
          POSTGRES_PASSWORD: dsm
          POSTGRES_DB: dsm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsm -d dsm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dsm:dsm@localhost:5432/dsm?schema=public

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dsm/db exec prisma generate

      - name: Lint
        run: pnpm -r lint

      # QA-004-CT-1 (qa-plan de US-004): el contrato de /v1/search fue el primero
      # en materializar este gate, pero el ruleset aplica a TODO openapi.yaml —
      # no es un check scoped a un endpoint.
      - name: Contract lint (OpenAPI)
        run: pnpm dlx @stoplight/spectral-cli lint apps/api/docs/api/openapi.yaml --ruleset .spectral.yaml --fail-severity=warn

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Apply migrations
        run: pnpm --filter @dsm/db migrate:deploy

      - name: Test
        run: pnpm -r test

      # Hay una clase entera de errores que NO existe hasta que algo se
      # construye: `next build` valida los exports de cada módulo de página, la
      # generación estática y la resolución de tipos por ruta. Nada de eso lo ve
      # `typecheck` ni `vitest`.
      #
      # Caso concreto que motivó el paso (US-004 FE, 2026-08-23): una constante
      # de copy exportada desde `page.tsx` para poder testearla. Las 787 pruebas
      # del front pasaban y el build fallaba con «is not a valid Page export
      # field». CI no buildeaba el front en ningún lado, así que eso habría
      # llegado a main.
      #
      # Va DESPUÉS de los tests a propósito: un test roto se diagnostica más
      # rápido que un build roto, y así el feedback más barato llega primero.
      # ALCANCE DE ESTE PASO, dicho explícito para que nadie lo lea de más:
      # verifica que el front COMPILE. No verifica que el artefacto sea
      # desplegable, y su salida no debe desplegarse nunca.
      #
      # La diferencia es concreta: de las cinco variables que el front consume,
      # sólo `API_INTERNAL_ORIGIN` lanza si falta. Las cuatro `NEXT_PUBLIC_*`
      # tienen `default` en el schema de `apps/web/src/lib/env.ts`, así que su
      # ausencia **no rompe el build: hornea placeholders en silencio**. Un
      # pipeline sin `NEXT_PUBLIC_SITE_URL` construye verde y publica canonicals
      # y `sitemap.xml` apuntando a `localhost`; el deploy se reporta exitoso y
      # el daño aparece días después en el índice de un buscador.
      #
      # Ese modo de falla NO lo cubre este paso ni ningún gate que sólo mire si
      # el build pasó — por construcción, porque el build pasa. Se cubre
      # inspeccionando el ARTEFACTO servido (US-019 T2.3: el `sitemap.xml`
      # publicado no debe contener `localhost`), que es un chequeo de despliegue
      # y no de compilación.
      #
      # Ojo con `.min(1, '… es requerida')` en ese schema: va seguido de
      # `.default(...)`, así que el mensaje NUNCA se dispara. Leer «requerida»
      # ahí y concluir que el build protege contra su ausencia es exactamente el
      # error que este comentario existe para evitar.
      - name: Build del frontend
        env:
          # Mismas variables que el build de producción exige. `next build` corre
          # con NODE_ENV=production, y `next.config.mjs` lanza si falta
          # API_INTERNAL_ORIGIN. En local la aporta `apps/web/.env.local`, que
          # está gitignorada: por eso un build verde en la máquina de alguien no
          # es evidencia de que CI vaya a pasar.
          API_INTERNAL_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
        run: pnpm --filter @dsm/web build
