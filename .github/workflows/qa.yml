name: qa-cross-stack

# Gates de la suite QA cross-stack (@dsm/qa, Layer 3) — qa-plan §12.
# - PR: funcional + aceptación + E2E + a11y + smoke-load contra el stack levantado.
# - nightly: lo mismo, como red por si un PR se saltea el gate.
# - pre-release (tag): + baseline de carga completa.
#
# AUTO-GATED (2026-07-26): cada paso se saltea limpio si su suite todavía no fue
# autorada. La suite se construye por fases (T1.3 → T2.x → T3.1 → T4.x → T5.2) y
# un workflow que invoca artefactos inexistentes rompería TODO PR mientras tanto.
# Cada gate se activa solo en cuanto sus archivos aterrizan — sin tocar el YAML.
# qa-cross-stack es una suite pesada de integración (stack completo + Newman + Cucumber +
# Playwright + k6 + seed de 5.000 SKUs) y necesita secretos (GEMINI/MP) que no viven en CI.
# NO corre en cada pull_request —generaba rojos y mails en todos los PRs sin señal útil—:
# el gate por-PR es `ci.yml` (lint + typecheck + test + build). Ésta corre nightly, en
# release tags, y a demanda.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # nightly
  push:
    tags: ['v*']

jobs:
  qa-cross-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dsm
          POSTGRES_PASSWORD: dsm
          POSTGRES_DB: dsm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dsm -d dsm" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://dsm:dsm@localhost:5432/dsm?schema=public
      JWT_SECRET: ci-secret
      ADMIN_AUTH_ENABLED: 'true'
      ADMIN_BOOTSTRAP_TOKEN: ci-bootstrap
      QA_API_BASE_URL: http://localhost:3000
      QA_WEB_BASE_URL: http://localhost:3100
      # El fallback de JWT minteado está prohibido en CI: la suite debe ejercitar
      # el login real (testing-standards §14.2). Si el seam se rompe, CI falla.
      QA_AUTH_STRICT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dsm/db exec prisma generate

      - name: Migraciones
        run: pnpm --filter @dsm/db migrate:deploy

      - name: Build + arranque de la API
        run: |
          pnpm --filter @dsm/api build
          # `nest start` busca dist/main; el build de nest queda anidado en
          # dist/apps/api/src/main.js → se arranca el entry real directamente.
          (node apps/api/dist/apps/api/src/main.js &)
          npx wait-on -t 120000 http://localhost:3000/health

      # El fixture de auth es la base de todas las suites: si el login real no
      # funciona, nada de lo de abajo tiene sentido. Se falla acá, temprano.
      - name: Fixture de auth — exige login real
        run: pnpm --filter @dsm/qa exec tsx support/admin-auth.smoke.ts --require-real

      # ---- Suites auto-gated: se saltean hasta que sus archivos existan ----

      - name: Funcional API (Newman)
        if: hashFiles('qa/functional/*.postman_collection.json') != ''
        run: pnpm --filter @dsm/qa test:functional

      - name: Aceptación BDD (Cucumber)
        if: hashFiles('qa/acceptance/**/*.feature') != ''
        run: pnpm --filter @dsm/qa test:acceptance -- --tags "not @deferred"

      # E2E y a11y corren en el browser contra el FE: necesitan apps/web arriba,
      # no sólo la API (faltaba en la versión original de este workflow).
      - name: Build + arranque del front
        # E2E y a11y corren TAMBIÉN en PR (decisión 2026-08-18): antes sólo iban
        # en nightly, y un PR que movió el panel bajo /admin rompió la suite L3
        # sin que nada se pusiera rojo durante un día. El costo por PR es levantar
        # el front y un browser; el beneficio es atribuir la ruptura al commit que
        # la causó, en vez de descubrirla mezclada con otros cambios.
        if: hashFiles('qa/e2e/*.config.ts') != ''
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
          # OBLIGATORIA desde el guard de US-014 FE: `next build` corre con
          # NODE_ENV=production y `next.config.mjs` LANZA si falta, así que sin
          # esta línea el paso no compila. Se rompía en silencio para quien
          # buildea local, porque ahí la aporta `apps/web/.env.local` — que está
          # en `.gitignore` y por lo tanto no existe en CI. Es el caso exacto de
          # una verificación que pasa por la configuración de la máquina y no
          # por el artefacto.
          #
          # Server-only (sin `NEXT_PUBLIC_`) a propósito: gobierna los rewrites
          # de `/v1/auth/*` y `/v1/cart/*`, que el navegador nunca llama directo.
          API_INTERNAL_ORIGIN: http://localhost:3000
          # `next start` toma el puerto de PORT. Se evita `-- -p 3100`: pnpm
          # reenvía el `--` literal y el flag no llega (mismo tropiezo que T1.1).
          PORT: '3100'
        run: |
          pnpm --filter @dsm/web build
          (pnpm --filter @dsm/web start &)
          npx wait-on -t 120000 http://localhost:3100

      - name: E2E cross-stack (Playwright)
        if: hashFiles('qa/e2e/playwright.config.ts') != ''
        run: pnpm --filter @dsm/qa exec playwright install --with-deps chromium && pnpm --filter @dsm/qa test:e2e

      - name: Accesibilidad (axe-core)
        if: hashFiles('qa/e2e/playwright.a11y.config.ts') != ''
        run: pnpm --filter @dsm/qa test:a11y

      # ---- Carga: smoke en PR, baseline completa en pre-release ----

      # El NFR de carga es sobre el TAMAÑO del dataset (≥5.000 SKUs): sin sembrar,
      # el check `total >= 5000` falla. `baseline.js` sólo hace login en setup().
      - name: Sembrar el dataset de carga (≥5.000 SKUs)
        if: hashFiles('qa/performance/seed-load-data.ts') != ''
        run: pnpm --filter @dsm/qa seed:load

      - name: Setup k6
        if: hashFiles('qa/performance/baseline.js') != ''
        uses: grafana/setup-k6-action@v1

      - name: k6 smoke-load (PR)
        if: github.event_name == 'pull_request' && hashFiles('qa/performance/baseline.js') != ''
        run: k6 run --vus 2 --duration 30s qa/performance/baseline.js

      - name: k6 baseline (pre-release)
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('qa/performance/baseline.js') != ''
        run: k6 run qa/performance/baseline.js
