name: qa-cross-stack

# Gates de la suite QA cross-stack (@dsm/qa, Layer 3) — qa-plan §12.
# - PR: funcional + aceptación + E2E + a11y + smoke-load contra el stack levantado.
# - nightly: lo mismo, como red por si un PR se saltea el gate.
# - pre-release (tag): + baseline de carga completa.
#
# AUTO-GATED (2026-07-26): cada paso se saltea limpio si su suite todavía no fue
# autorada. La suite se construye por fases (T1.3 → T2.x → T3.1 → T4.x → T5.2) y
# un workflow que invoca artefactos inexistentes rompería TODO PR mientras tanto.
# Cada gate se activa solo en cuanto sus archivos aterrizan — sin tocar el YAML.
# qa-cross-stack es una suite pesada de integración (stack completo + Newman + Cucumber +
# Playwright + k6 + seed de 5.000 SKUs) y necesita secretos (GEMINI/MP) que no viven en CI.
# NO corre en cada pull_request —generaba rojos y mails en todos los PRs sin señal útil—:
# el gate por-PR es `ci.yml` (lint + typecheck + test + build). Ésta corre nightly, en
# release tags, y a demanda.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # nightly
  push:
    tags: ['v*']

jobs:
  qa-cross-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dsm
          POSTGRES_PASSWORD: dsm
          POSTGRES_DB: dsm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dsm -d dsm" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://dsm:dsm@localhost:5432/dsm?schema=public
      JWT_SECRET: ci-secret
      ADMIN_AUTH_ENABLED: 'true'
      ADMIN_BOOTSTRAP_TOKEN: ci-bootstrap
      QA_API_BASE_URL: http://localhost:3000
      QA_WEB_BASE_URL: http://localhost:3100
      # El fallback de JWT minteado está prohibido en CI: la suite debe ejercitar
      # el login real (testing-standards §14.2). Si el seam se rompe, CI falla.
      QA_AUTH_STRICT: 'true'
      # US-010/ADR-0006: sin esto, POST /v1/checkout/simulate-payment no existe
      # y `pago-webhook.feature` falla con 404 en vez de confirmar el pago.
      PAYMENTS_SIMULATED_ENABLED: 'true'
      # `qa/support/customer-auth.ts` (tokenDeResetDesde, usado por
      # borrado-cuenta.feature AC-10) lee el stdout de la API desde
      # `QA_API_LOG` — variable DISTINTA de la que ya usa `qa/support/api-log.ts`
      # (`QA_API_LOG_FILE`, para los avisos de NotificationPort). Dos
      # convenciones de nombre para el mismo archivo en este harness; en vez
      # de redirigir el stdout a dos rutas, se apunta esta al mismo archivo
      # que "Build + arranque de la API" ya escribe.
      QA_API_LOG: /tmp/dsm-qa-api-us010.log
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # La suite de aceptación (Cucumber) visita páginas con Playwright
      # (`CatalogWorld.visitar`, `acceptance/steps/world.ts`) — no sólo los
      # steps de E2E/a11y de más abajo. Sin este install, TODO escenario que
      # visite una página falla con "Executable doesn't exist" apenas arranca
      # el browser, antes de que ninguna aserción de negocio corra. Movido acá
      # (antes vivía sólo condicionado a `qa/e2e/*.config.ts`, demasiado tarde
      # para la suite de aceptación) — instalar una vez cubre ambos consumidores.
      - name: Playwright browsers
        run: pnpm --filter @dsm/qa exec playwright install --with-deps chromium

      # `qa/acceptance/steps/enriquecimiento.steps.ts` lee `GEMINI_API_KEY` de
      # un `.env` en la raíz a nivel de MÓDULO (corre al importar el step,
      # antes de que cualquier escenario arranque) — sin este archivo, cucumber
      # revienta con ENOENT al cargar el support code y NINGÚN escenario llega
      # a ejecutar, ni siquiera los que no tocan enriquecimiento. El valor no
      # necesita ser una key real: el step sólo la usa como placeholder
      # "inválido conocido" para afirmar que nunca aparece en una respuesta
      # (SC-005-N4) — mismo criterio que el `.env` que RUN-MVP.md hace crear a
      # mano en local.
      - name: .env para el support code de QA (GEMINI_API_KEY placeholder)
        run: echo "GEMINI_API_KEY=ci-fake-gemini-key-invalid" > .env

      - name: Generate Prisma client
        run: pnpm --filter @dsm/db exec prisma generate

      - name: Migraciones
        run: pnpm --filter @dsm/db migrate:deploy

      - name: Build + arranque de la API
        # `qa/scripts/api-up.sh` (no un `node dist/main.js` crudo) — arranca la
        # API con los mismos valores que corrige RUN-MVP.md §"Correr la suite
        # de QA": sin `CORS_ALLOWED_ORIGINS` la PRIMERA escritura del carrito
        # pasa y la SEGUNDA muere en 403 (falla como si el producto estuviera
        # roto, no como un problema de entorno); sin `AUTH_COOKIE_SECURE=false`
        # una cookie `Secure` no vuelve por http. Roto desde 2026-09-02 (el
        # `node` directo no seteaba ninguna de las dos) — 5+ corridas nightly
        # fallando sin que las suites E2E/BDD/a11y llegaran a ejecutar un solo
        # escenario.
        # `qa/support/api-log.ts` (SC-010-H2 y sus C-2/H-4 hermanas de
        # `ordenes.feature`) lee el stdout de la API desde `QA_API_LOG_FILE`
        # (default `/tmp/dsm-qa-api-us010.log`) para observar los avisos de
        # `NotificationPort` — sin redirigir el stdout ahí, esos escenarios
        # fallan con "no se pudo leer" antes de llegar a afirmar nada.
        env:
          QA_API_PORT: '3000'
        run: |
          pnpm --filter @dsm/api build
          bash qa/scripts/api-up.sh > /tmp/dsm-qa-api-us010.log 2>&1 &
          npx wait-on -t 120000 http://localhost:3000/health

      # El fixture de auth es la base de todas las suites: si el login real no
      # funciona, nada de lo de abajo tiene sentido. Se falla acá, temprano.
      - name: Fixture de auth — exige login real
        run: pnpm --filter @dsm/qa exec tsx support/admin-auth.smoke.ts --require-real

      # La suite de aceptación (Cucumber) YA visita páginas reales del FE vía
      # Playwright (`browse.feature`, `CatalogWorld.visitar`) — no es exclusivo
      # de "E2E cross-stack"/"Accesibilidad" de más abajo. Este paso vivía
      # DESPUÉS de "Aceptación BDD" en el orden original: cada escenario que
      # visitara una página fallaba con `ERR_CONNECTION_REFUSED` (el front ni
      # siquiera había arrancado todavía), no por CORS ni por env vars —
      # cuarto bloqueo encontrado verificando los fixes anteriores contra el
      # workflow real.
      - name: Build + arranque del front
        # E2E y a11y corren TAMBIÉN en PR (decisión 2026-08-18): antes sólo iban
        # en nightly, y un PR que movió el panel bajo /admin rompió la suite L3
        # sin que nada se pusiera rojo durante un día. El costo por PR es levantar
        # el front y un browser; el beneficio es atribuir la ruptura al commit que
        # la causó, en vez de descubrirla mezclada con otros cambios.
        if: hashFiles('qa/e2e/*.config.ts') != ''
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
          # OBLIGATORIA desde el guard de US-014 FE: `next build` corre con
          # NODE_ENV=production y `next.config.mjs` LANZA si falta, así que sin
          # esta línea el paso no compila. Se rompía en silencio para quien
          # buildea local, porque ahí la aporta `apps/web/.env.local` — que está
          # en `.gitignore` y por lo tanto no existe en CI. Es el caso exacto de
          # una verificación que pasa por la configuración de la máquina y no
          # por el artefacto.
          #
          # Server-only (sin `NEXT_PUBLIC_`) a propósito: gobierna los rewrites
          # de `/v1/auth/*` y `/v1/cart/*`, que el navegador nunca llama directo.
          API_INTERNAL_ORIGIN: http://localhost:3000
          # `apps/web/src/lib/env.ts` le da su PROPIO default a esta var
          # (`http://localhost:3000`, el puerto de la API, no el del sitio) —
          # sin ella acá, el sitemap y los canonicals se generan con el origen
          # equivocado (TC-204, `categoria-ssr-seo.spec.ts`: esperaba `:3100`,
          # recibía `:3000`). Se inlinea en build, como `NEXT_PUBLIC_API_BASE_URL`.
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          # `next start` toma el puerto de PORT. Se evita `-- -p 3100`: pnpm
          # reenvía el `--` literal y el flag no llega (mismo tropiezo que T1.1).
          PORT: '3100'
        run: |
          pnpm --filter @dsm/web build
          (pnpm --filter @dsm/web start &)
          npx wait-on -t 120000 http://localhost:3100

      # ---- Suites auto-gated: se saltean hasta que sus archivos existan ----

      - name: Funcional API (Newman)
        if: hashFiles('qa/functional/*.postman_collection.json') != ''
        run: pnpm --filter @dsm/qa test:functional

      - name: Aceptación BDD (Cucumber)
        # `@blocked` (enriquecimiento.feature SC-005-H1/H2/C3/N2/N3,
        # pago-webhook.feature SC-010-N2): escenarios que necesitan una
        # credencial real (Gemini/MercadoPago) que CI no tiene y nunca va a
        # tener — están tageados así a propósito (design.md §D-QA1,
        # proposal.md OQ-QA-005-1) para no fingir que corren. `not @deferred`
        # sólo, sin `not @blocked`, los dejaba pasar y fallar como si fueran
        # un defecto real.
        #
        # `@frontend` (checkout.feature SC-008-X3, #106): cross-feature que
        # requiere renderizado real de UI — vive en Playwright
        # (qa/e2e/checkout.spec.ts), sin step defs acá a propósito. El CLI
        # `--tags` de este paso PISA el default de `cucumber.mjs` (no se
        # combina, verificado por #106) — hay que repetir la exclusión acá,
        # no alcanza con tocar sólo el config.
        #
        # Invoca `cucumber-js` DIRECTO, con `cd qa` (no `pnpm --filter @dsm/qa
        # test:acceptance -- --tags ...`): `pnpm --filter <pkg> <script> --
        # <args>` inserta un `--` LITERAL en el comando final (verificado
        # contra el log real de este mismo workflow), y `cucumber-js` (yargs)
        # trata ese `--` como "fin de opciones" — todo lo que sigue,
        # `--tags` incluido, se descarta en silencio. Confirmado en local:
        # 178 escenarios (el filtro nunca aplicó) vía `pnpm --filter`, 172
        # (178 − 6 `@blocked`, el número correcto) invocando `cucumber-js`
        # directo con el mismo `--tags`.
        #
        # `pnpm --filter @dsm/qa exec` (sin `run`) NO cambia el cwd al
        # paquete filtrado — el proceso queda en la raíz del repo, y
        # `NODE_OPTIONS=--import tsx` no resuelve `tsx` desde ahí
        # (`ERR_MODULE_NOT_FOUND`, visto en el run real). `cd qa` explícito
        # es el mismo cwd que ya usaba el script npm original.
        if: hashFiles('qa/acceptance/**/*.feature') != ''
        env:
          NODE_OPTIONS: '--import tsx'
        run: cd qa && npx cucumber-js --config acceptance/cucumber.mjs --tags "not @deferred and not @blocked and not @frontend"

      - name: E2E cross-stack (Playwright)
        # Browsers ya instalados arriba (paso "Playwright browsers") — instalar
        # de nuevo acá sería un no-op lento, no una corrección.
        if: hashFiles('qa/e2e/playwright.config.ts') != ''
        run: pnpm --filter @dsm/qa test:e2e

      - name: Accesibilidad (axe-core)
        if: hashFiles('qa/e2e/playwright.a11y.config.ts') != ''
        run: pnpm --filter @dsm/qa test:a11y

      # ---- Carga: smoke en PR, baseline completa en pre-release ----

      # El NFR de carga es sobre el TAMAÑO del dataset (≥5.000 SKUs): sin sembrar,
      # el check `total >= 5000` falla. `baseline.js` sólo hace login en setup().
      - name: Sembrar el dataset de carga (≥5.000 SKUs)
        if: hashFiles('qa/performance/seed-load-data.ts') != ''
        run: pnpm --filter @dsm/qa seed:load

      - name: Setup k6
        if: hashFiles('qa/performance/baseline.js') != ''
        uses: grafana/setup-k6-action@v1

      - name: k6 smoke-load (PR)
        if: github.event_name == 'pull_request' && hashFiles('qa/performance/baseline.js') != ''
        run: k6 run --vus 2 --duration 30s qa/performance/baseline.js

      - name: k6 baseline (pre-release)
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('qa/performance/baseline.js') != ''
        run: k6 run qa/performance/baseline.js
